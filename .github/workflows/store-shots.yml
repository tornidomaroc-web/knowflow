name: store-shots

# Renders the designed App Store screenshots (docs/store/screenshots-designed)
# on a plain runner and checks them: scripts/store-shots/render.mjs writes a
# static page per entry of captions.json and the runner image's own Google
# Chrome photographs it headless at 1320 x 2868; scripts/store-shots/check.py
# (standard library) refuses any PNG that is not exactly that size or carries
# an alpha channel, and proves from the font's cmap that every caption letter
# has a Rubik glyph. The committed PNGs are checked too, and compared with the
# fresh renders pixel by pixel; a mismatch above the rendering-noise bound
# fails the run, so what the repository shows is what the script makes.
# render.mjs also refuses a layout that fails at phone width (caption onto
# the phone, overflow, more than two lines, a broken gold phrase, Rubik not
# loaded, Arabic letters not joined); screen_intact.py proves the app screen
# is uncovered; ocr_scan.py refuses an email, test account or price word.
#
# Since item 4i (PR 1) it also checks the iOS 1.1 frame: design C light, at
# 1320 x 2868 and 1206 x 2622, over stand-in screens, with planted cases for
# each new check (see the 1.1 steps below).
#
# No secret, no environment, no npm install, no third-party action beyond the
# pinned checkout. Pull requests only, on these paths, plus manual runs.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/store/screenshots-designed/**'
      - 'docs/store/screenshots/**'
      - 'scripts/store-shots/**'
      # The 1.1 frame reads KEEP_TOGETHER from the app's own list.
      - 'src/lib/keep-together.ts'
      - '.github/workflows/store-shots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-shots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Render and check the designed screenshots (Chrome headless, no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Chrome and Node from the image
        run: |
          set -eu
          google-chrome --version
          node --version
          python3 --version
          fc-list | grep -ci rubik || true

      - name: Render every entry of captions.json
        env:
          CHROME: google-chrome
        run: node scripts/store-shots/render.mjs --out "$RUNNER_TEMP/render"

      - name: Check the fresh renders and the committed PNGs
        run: |
          set -eu
          python3 scripts/store-shots/check.py "$RUNNER_TEMP"/render/*/*.png
          committed=$(ls docs/store/screenshots-designed/*/*.png 2>/dev/null || true)
          if [ -n "$committed" ]; then python3 scripts/store-shots/check.py $committed; else echo "no committed PNG yet"; fi

      # Nothing the design adds covers the app screen: the screen area of every
      # PNG equals its raw capture, with a negative control that must be caught;
      # and the committed set is exactly the ten entries of captions.json.
      - name: The app screen is uncovered in every render, and all ten are committed
        run: |
          set -eu
          python3 -m pip install --quiet --disable-pip-version-check "pillow==12.2.0"
          python3 scripts/store-shots/screen_intact.py "$RUNNER_TEMP/render"
          python3 scripts/store-shots/screen_intact.py docs/store/screenshots-designed

      # No email, test account, price, plan, upgrade or free word anywhere in the
      # committed pictures, app screen included, read by Tesseract (Ubuntu
      # archive package, free); the reader must see the KnowFlow mark on each
      # and catch a drawn email address, or the step fails.
      - name: No email or personal data in any picture (OCR)
        run: |
          set -eu
          sudo apt-get update -qq
          # The Arabic set is read with ara+eng (ocr_scan.py, which fails if a model is missing).
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara > /dev/null
          tesseract --version | head -1
          python3 scripts/store-shots/ocr_scan.py docs/store/screenshots-designed/*/*.png

      # The committed PNGs must be the script's output: the fresh render of
      # the same entry may differ only by rendering noise (font hinting,
      # gradient dithering), bounded here at 1.5 % of the pixels differing by
      # more than 24 of 255 on any channel. Pillow from PyPI, pinned.
      - name: The committed PNGs match the fresh renders
        run: |
          set -eu
          python3 - "$RUNNER_TEMP/render" <<'PY'
          import glob, os, sys
          from PIL import Image, ImageChops
          fresh = sys.argv[1]
          fails = 0
          for p in sorted(glob.glob('docs/store/screenshots-designed/*/*.png')):
              rel = os.path.relpath(p, 'docs/store/screenshots-designed')
              q = os.path.join(fresh, rel)
              a, b = Image.open(p).convert('RGB'), Image.open(q).convert('RGB')
              diff = ImageChops.difference(a, b).convert('L').point(lambda v: 255 if v > 24 else 0)
              bad = sum(1 for v in diff.getdata() if v)
              ratio = bad / (a.width * a.height)
              ok = ratio <= 0.015
              print(('ok   ' if ok else 'FAIL ') + f'{rel}: {ratio:.4%} of pixels differ from the fresh render')
              fails += 0 if ok else 1
          sys.exit(1 if fails else 0)
          PY

      # THE 1.1 SET (item 4i, PR 1): the light design C frame, at both App
      # Store iPhone sizes. Its captions are the owner's approved file, byte
      # for byte; every render is checked at both sizes, and every check has
      # a planted case it must catch. The screens are STAND-INS (the 1.0.1
      # raw captures): this tests the frame only, and nothing here is
      # committed as the 1.1 set (render.mjs refuses an --out in the repo).
      - name: 1.1 captions are the approved file, byte for byte
        run: python3 scripts/store-shots/captions_1_1.py check

      - name: 1.1 frame, layout test at 1320x2868 and 1206x2622 (stand-in screens)
        env:
          CHROME: google-chrome
        run: |
          set -eu
          for z in 1320x2868 1206x2622; do
            node scripts/store-shots/render.mjs --set 1.1 --layout-test --size "$z" --out "$RUNNER_TEMP/v11/$z"
          done

      - name: 1.1 planted cases (orphan, split phrase, Latin not isolated, old gold, light ink) at both sizes
        env:
          CHROME: google-chrome
        run: |
          set -eu
          for z in 1320x2868 1206x2622; do
            node scripts/store-shots/render.mjs --set 1.1 --plants --size "$z" --out "$RUNNER_TEMP/v11-plants/$z"
          done
          python3 scripts/store-shots/contrast.py --expect-fail "$RUNNER_TEMP/v11-plants"

      - name: 1.1 checks on both sizes (size, alpha, glyphs, words, contrast, screen uncovered, OCR)
        run: |
          set -eu
          for z in 1320x2868 1206x2622; do
            python3 scripts/store-shots/check.py --size "$z" --captions captions-1.1.json "$RUNNER_TEMP/v11/$z"/*/*.png
            python3 scripts/store-shots/screen_intact.py --layout "$RUNNER_TEMP/v11/$z"
            python3 scripts/store-shots/ocr_scan.py "$RUNNER_TEMP/v11/$z"/*/*.png
          done
          python3 scripts/store-shots/contrast.py "$RUNNER_TEMP/v11"

      - name: Keep the 1.1 layout test (both sizes, plants, layout files)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-shots-1.1-layout-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v11
            ${{ runner.temp }}/v11-plants
          if-no-files-found: error
          retention-days: 14

      - name: Keep the fresh renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-shots-${{ github.sha }}
          path: ${{ runner.temp }}/render
          if-no-files-found: error
          retention-days: 14
