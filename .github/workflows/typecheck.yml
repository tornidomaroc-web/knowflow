name: typecheck

# Runs `tsc --noEmit` on every PR into main, and on main itself after merge.
#
# The push-to-main trigger is deliberate and is NOT redundant with the
# pull_request trigger. Two reasons:
#   1. A PR is typechecked against a MERGE COMMIT of the branch and main at the
#      time of the run. If main moves afterwards, a green PR can still land a red
#      main (semantic conflict — e.g. two PRs each type-clean alone that aren't
#      together). Only a run on main itself proves main is actually clean.
#   2. Enabling this as a required status check needs a green run on main to
#      exist first. Without this trigger, merging produces no main run at all.
#
# Both triggers are free: the repository is public, so Actions minutes are not
# billed (GitHub bills only private-repo minutes).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job only reads the tree. It never writes to the repo,
# posts comments, or publishes packages.
permissions:
  contents: read

# Superseded PR runs are pointless, so cancel them. Runs on main are NEVER
# cancelled — a cancelled main run leaves no green baseline, which is exactly
# what the required status check depends on.
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tsc:
    # Pinned, not `ubuntu-latest`: `latest` silently rolls to the next LTS image
    # and can change toolchain behaviour with no commit to this repo.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to immutable commit SHAs, not tags. Tags like `v7` are
      # mutable and are republished in place, so a tag pin would NOT prevent an
      # action's behaviour from changing under us.
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Exact patch, not `22.x`. Node 20 went EOL 2026-04-30; 22 is LTS
          # ("Jod") until 2027-04-30.
          node-version: 22.23.1
          cache: npm

      # `ci`, not `install`: installs exactly what package-lock.json pins and
      # fails if the lockfile and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Register #54. The two account-deletion orphan arms cannot be exercised --
      # reaching either needs fault injection, refused at both ends of the arc --
      # so the call sites are machine-checked statically instead. This does NOT
      # shrink that gap: the gap is that the arms never execute, and a static
      # check executes nothing either. What it removes is silent drift and
      # omission, which the gap never covered and which is the likelier failure:
      # a future third arm added by someone who does not remember the argument.
      # Precedent: scripts/verify-skipped-migrations.awk (register #40, PR #62).
      #
      # It rides in THIS workflow rather than a new one on purpose. Register #65
      # is that an absent run is as silent as a failed one; a new workflow is a
      # new thing that can be absent, while a step inside an already-required
      # check cannot be skipped without the check itself going missing. For the
      # same reason the workflow keeps its name -- renaming it would break the
      # required status check that branch protection is configured against.
      - name: Verify the orphan call sites (register #54)
        run: python3 scripts/verify-orphan-call-sites.py

      # Register #114. Drives the REAL /api/summarize handler with a stubbed model
      # reply (no network, no credential, no database) and fails if a summary the
      # model did not finish is saved, or if the output ceiling cannot hold the
      # word budget the prompt sets, written in Arabic. It rides in this required
      # check for the reason given above: a step here cannot go missing quietly.
      - name: Verify an unfinished summary is never saved (register #114)
        run: node --experimental-strip-types scripts/verify-summary-cutoff.mjs

      # Register #114, the quiz half. Cuts a valid quiz reply at every character
      # and drives the REAL /api/quiz/generate handler with each; fails if any cut
      # is saved. It passes today by the route's strict JSON parse, and exists so
      # that a future "lenient" parse cannot start saving unfinished quizzes.
      - name: Verify an unfinished quiz is never saved (register #114)
        run: node --experimental-strip-types scripts/verify-quiz-cutoff.mjs

      # Register #80(b). Drives the REAL /api/agent handler and the REAL
      # enforceLimit with a Pro entitlement, 26 questions in ONE conversation;
      # fails unless the 26th is refused with a 429 before any model call. A
      # Free control (10, then a 429) keeps a harness that refuses nothing, or
      # everything, from passing.
      - name: Verify Pro stops at 25 questions a day, in one conversation too (register #80(b))
        run: node --experimental-strip-types scripts/verify-pro-question-cap.mjs

      # Register #80(b), the summary and quiz half. Drives the REAL /api/summarize and
      # /api/quiz/generate handlers and the REAL enforceLimit with a Pro entitlement,
      # six fresh documents each on one day; fails unless the 6th of each is refused
      # with a 429 before any model call. A Free control (5, then a 429) keeps a
      # harness that refuses nothing, or everything, from passing.
      - name: Verify Pro stops at 5 summaries and 5 quizzes a day (register #80(b))
        run: node --experimental-strip-types scripts/verify-pro-summary-quiz-caps.mjs
