name: typecheck

# Runs `tsc --noEmit` on every PR into main, and on main itself after merge.
#
# The push-to-main trigger is deliberate and is NOT redundant with the
# pull_request trigger. Two reasons:
#   1. A PR is typechecked against a MERGE COMMIT of the branch and main at the
#      time of the run. If main moves afterwards, a green PR can still land a red
#      main (semantic conflict — e.g. two PRs each type-clean alone that aren't
#      together). Only a run on main itself proves main is actually clean.
#   2. Enabling this as a required status check needs a green run on main to
#      exist first. Without this trigger, merging produces no main run at all.
#
# Both triggers are free: the repository is public, so Actions minutes are not
# billed (GitHub bills only private-repo minutes).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job only reads the tree. It never writes to the repo,
# posts comments, or publishes packages.
permissions:
  contents: read

# Superseded PR runs are pointless, so cancel them. Runs on main are NEVER
# cancelled — a cancelled main run leaves no green baseline, which is exactly
# what the required status check depends on.
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Step CI-Cost-1: what this run is about. On a pull request or a merge that
  # touched only docs/**, *.md or *.png the real jobs below are SKIPPED, and a
  # skipped job reports its required check as success, so the branch rule
  # holds with the same names and no second workflow can mask a failure.
  # Step CI-Relay-Fix: a STRICT allowlist, the same in db-types.yml and
  # ingestion-image.yml: only docs/**, a top-level *.md and .github/*.md are
  # docs (no *.md or *.png elsewhere, no `..` segment), an empty list is code,
  # and docs/copy/** is CODE (Step Redesign-3): its batch files are what
  # verify-arabic-copy.mjs holds ar.ts to, so a copy-only change must run it,
  # and --no-renames lists both sides of a move (a plain --name-only lists a
  # file moved from src/ into docs/ as docs/ alone). Fail closed: the real
  # jobs run unless detect said `no`, so a detect that fails or never runs
  # cannot turn a required check into a skipped green.
  detect:
    name: Does this change touch the code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.d.outputs.code }}
    steps:
      - name: Check out the change and its base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: d
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ -n "$BASE_SHA" ]; then git fetch --no-tags --depth=1 origin "$BASE_SHA"; range="$BASE_SHA...HEAD"; else range="HEAD~1..HEAD"; fi
          changed=$(git diff --name-only --no-renames "$range" || git diff --name-only --no-renames HEAD~1 HEAD)
          echo "$changed" | sed 's/^/  /'
          if [ -z "$changed" ] || echo "$changed" | grep -vqE '^(docs/.+|[^/]+\.md|\.github/[^/]+\.md)$' || echo "$changed" | grep -qE '(^|/)\.\.(/|$)|^docs/copy/'; then echo "code=yes" >> "$GITHUB_OUTPUT"; echo "code changed: run"; else echo "code=no" >> "$GITHUB_OUTPUT"; echo "docs only: skip"; fi

  tsc:
    needs: detect
    if: ${{ !cancelled() && needs.detect.outputs.code != 'no' }}
    # Pinned, not `ubuntu-latest`: `latest` silently rolls to the next LTS image
    # and can change toolchain behaviour with no commit to this repo.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to immutable commit SHAs, not tags. Tags like `v7` are
      # mutable and are republished in place, so a tag pin would NOT prevent an
      # action's behaviour from changing under us.
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Exact patch, not `22.x`. Node 20 went EOL 2026-04-30; 22 is LTS
          # ("Jod") until 2027-04-30.
          node-version: 22.23.1
          cache: npm

      # `ci`, not `install`: installs exactly what package-lock.json pins and
      # fails if the lockfile and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Register #54. The two account-deletion orphan arms cannot be exercised --
      # reaching either needs fault injection, refused at both ends of the arc --
      # so the call sites are machine-checked statically instead. This does NOT
      # shrink that gap: the gap is that the arms never execute, and a static
      # check executes nothing either. What it removes is silent drift and
      # omission, which the gap never covered and which is the likelier failure:
      # a future third arm added by someone who does not remember the argument.
      # Precedent: scripts/verify-skipped-migrations.awk (register #40, PR #62).
      #
      # It rides in THIS workflow rather than a new one on purpose. Register #65
      # is that an absent run is as silent as a failed one; a new workflow is a
      # new thing that can be absent, while a step inside an already-required
      # check cannot be skipped without the check itself going missing. For the
      # same reason the workflow keeps its name -- renaming it would break the
      # required status check that branch protection is configured against.
      - name: Verify the orphan call sites (register #54)
        run: python3 scripts/verify-orphan-call-sites.py

      # Register #114. Drives the REAL /api/summarize handler with a stubbed model
      # reply (no network, no credential, no database) and fails if a summary the
      # model did not finish is saved, or if the output ceiling cannot hold the
      # word budget the prompt sets, written in Arabic. It rides in this required
      # check for the reason given above: a step here cannot go missing quietly.
      - name: Verify an unfinished summary is never saved (register #114)
        run: node --experimental-strip-types scripts/verify-summary-cutoff.mjs

      # Register #114, the quiz half. Cuts a valid quiz reply at every character
      # and drives the REAL /api/quiz/generate handler with each; fails if any cut
      # is saved. It passes today by the route's strict JSON parse, and exists so
      # that a future "lenient" parse cannot start saving unfinished quizzes.
      - name: Verify an unfinished quiz is never saved (register #114)
        run: node --experimental-strip-types scripts/verify-quiz-cutoff.mjs

      # Register #80(b). Drives the REAL /api/agent handler and the REAL
      # enforceLimit with a Pro entitlement, 26 questions in ONE conversation;
      # fails unless the 26th is refused with a 429 before any model call. A
      # Free control (10, then a 429) keeps a harness that refuses nothing, or
      # everything, from passing.
      # G2 and G4: the answer prompt names a passage's page only from its label
      # (never invented, nothing when NULL) and keeps the file's own terms; the
      # real /api/agent answers with and WITHOUT the page columns (before the migration).
      - name: Verify the answer prompt's page labels and the file's own terms (G2, G4)
        run: node --experimental-strip-types scripts/verify-answer-prompt.mjs

      - name: Verify Pro stops at 25 questions a day, in one conversation too (register #80(b))
        run: node --experimental-strip-types scripts/verify-pro-question-cap.mjs

      # Register #80(b), the summary and quiz half. Drives the REAL /api/summarize and
      # /api/quiz/generate handlers and the REAL enforceLimit with a Pro entitlement,
      # six fresh documents each on one day; fails unless the 6th of each is refused
      # with a 429 before any model call. A Free control (5, then a 429) keeps a
      # harness that refuses nothing, or everything, from passing.
      - name: Verify Pro stops at 5 summaries and 5 quizzes a day (register #80(b))
        run: node --experimental-strip-types scripts/verify-pro-summary-quiz-caps.mjs

      # Register #83. Drives the REAL middleware and the REAL i18n module: one
      # default (Arabic), the remembered-locale cookie outranking Accept-Language,
      # and the in-app language switch that keeps the page.
      - name: Verify one default locale, the remembered choice and the in-app switch (register #83)
        run: node --experimental-strip-types scripts/verify-locale-default.mjs

      # Register #46 (the toggle) and three items #101 held. Executes the inline
      # theme boot script against a fake document, and checks that nothing pins
      # the theme, that color-scheme and the Arabic tracking resets are set, and
      # that the 404 is the product's own page.
      - name: Verify the theme boots from the cookie before paint (register #46, #101)
        run: node --experimental-strip-types scripts/verify-theme.mjs

      # Apple 3.1.1(a), the Phase 8 gate (register #46). Calls the three real server
      # refusals with the native and web platform, and RENDERS the real Settings and
      # StudentHome with react-dom/server: no purchase link or upgrade sentence in
      # the store build, every one of them on the web.
      - name: Verify no purchase link reaches the store build (Apple 3.1.1(a), register #46)
        run: node --experimental-strip-types scripts/verify-store-purchase-links.mjs

      # docs/store/STORE_PATH.md step a. The app is a shell over the live site,
      # so the server tells the two apart per request (the user-agent token
      # KnowFlowApp/<n>). This proof renders every gated surface both ways from
      # its real .tsx, drives the real middleware with real NextRequests, and
      # scans src/ so a new pricing link, upgrade href or Google button that
      # does not go through purchaseLinksAllowed / googleSignInAllowed fails
      # here. Shown red on a deliberate break (the Google gate removed; an
      # ungated /pricing link added) before it was merged.
      - name: Verify the platform marker only removes, and every purchase link and Google button is gated (STORE_PATH.md step a)
        run: node --experimental-strip-types scripts/verify-platform-gate.mjs

      # Step Wording-1, Apple 3.1.3(f). The app's one wording rule
      # (scripts/lib/app-wording.mjs: plan, subscription, upgrade, premium, Pro,
      # price, checkout, free; Arabic by normalised stem) over every surface the
      # app reaches, rendered from its real .tsx with the real dictionary in
      # both locales as the reviewer sees it, plus the whole dictionary against
      # its stated gates, plus the in-app probe's copy of the rule. The planted
      # run comes first and MUST fail: a planted sentence in Settings and in the
      # dictionary, so a proof that cannot fail cannot pass here.
      - name: Verify the wording proof fails on a planted sentence (Step Wording-1)
        run: |
          if KF_WORDING_PLANT=1 node --experimental-strip-types scripts/verify-app-wording.mjs; then
            echo "the planted sentence was NOT caught: the wording proof is blind"; exit 1
          fi
          echo "planted sentence caught, as it must be"
      # Step Store-Shots-1: the Pro-only cancel card may name the subscription
      # but never invite a new one inside the app; planted, it must fail.
      - name: Verify the wording proof fails on a planted "subscribe again" in the app's cancel card (Step Store-Shots-1)
        run: |
          if KF_WORDING_PLANT_RESUB=1 node --experimental-strip-types scripts/verify-app-wording.mjs; then
            echo "the planted line was NOT caught: the cancel-card check is blind"; exit 1
          fi
          echo "planted line caught, as it must be"
      - name: Verify the app shows no plan, subscription, upgrade, price or free wording (Step Wording-1)
        run: node --experimental-strip-types scripts/verify-app-wording.mjs

      # In-app Pro, the app half (iOS 1.1, item 4d): shell 2 only; finish() only
      # after the server's 200; the paywall in every state; R1 and R2; the
      # shell-2 wording rule (purchase words only inside data-kf-iap) with its
      # forced cases; the native plugin registered. The planted run comes first
      # and MUST fail: a purchase word outside data-kf-iap on shell 2 Settings.
      - name: Verify the in-app Pro proof fails on a purchase word outside data-kf-iap (in-app Pro)
        run: |
          if KF_IAP_PLANT=1 node --experimental-strip-types scripts/verify-iap-app.mjs; then
            echo "the planted word was NOT caught: the shell-2 wording rule is blind"; exit 1
          fi
          echo "planted word caught, as it must be"
      - name: Verify in-app Pro (paywall, StoreKit flow, R1, R2, shell 2 only)
        run: node --experimental-strip-types scripts/verify-iap-app.mjs

      # Item 4j, store step 1 (Apple 3.1.2): /terms carries the App Store
      # subscription terms; the paywall's Terms link lands on them; the web
      # shows them, build 8 never, build 9 only inside data-kf-iap. The planted
      # run (the section unmarked in the app twin) comes first and MUST fail.
      - name: Verify the App Store terms proof fails on the section leaked into the app twin (store step 1)
        run: |
          if KF_TERMS_PLANT=1 node --experimental-strip-types scripts/verify-terms-iap.mjs; then
            echo "the leaked section was NOT caught: the terms proof is blind"; exit 1
          fi
          echo "leaked section caught, as it must be"
      - name: Verify the App Store subscription terms and the paywall's Terms link (store step 1)
        run: node --experimental-strip-types scripts/verify-terms-iap.mjs

      # Voice input in Ask (iOS 1.1, item 4e): the bridge null on the web, in
      # Android, without the plugin and behind a forged user agent; the take
      # appended, never sent (fetch spied); every outcome's line in both
      # locales; the 413 path; one server HTML for every shell; the native
      # plugin, its registration, the purpose strings and the manifest.
      - name: Verify voice input in Ask (shell 2 with the plugin, appended, never sent)
        run: node --experimental-strip-types scripts/verify-voice-input.mjs

      # Register #96, corrected: viewport-fit=cover is declared and every fixed bar
      # accounts for its safe-area inset.
      - name: Verify the iPhone safe areas are declared and used (register #96)
        run: node --experimental-strip-types scripts/verify-safe-areas.mjs

      # Sign in with Apple, item 4f PR 1 (native, app only, no web OAuth): the plugin
      # gate, the nonce, signInWithIdToken and the first-sign-in name, the ES256 client
      # secret, the code exchange and revoke against stubs (wrong sub, expired code,
      # missing env, timeout all refuse without deleting), DELETE /api/account byte for
      # byte as main for accounts without Apple, the delete card, the drafts.
      - name: Verify Sign in with Apple (native gate, deletion confirmed by Apple, revoke)
        run: node --experimental-strip-types scripts/verify-apple-signin.mjs

      # Sign in with Apple, item 4f PR 2 (ios/ only): KnowFlowApple.swift read from
      # source (available opens no sheet; signIn: hashed nonce, fullName + email,
      # web view window, one call at a time, canceled/failed, no token logged), its
      # resolved keys parsed by apple-bridge.ts parseAuthorization(), App.entitlements
      # and CODE_SIGN_ENTITLEMENTS in both App configurations, the pbxproj entries,
      # the registration and probe, ios-smoke proof 11, the signed-in apple-login
      # reading and the TestFlight signature check. The build itself is ios-smoke's.
      # In-app rating, item 4h PR 2 (sections 9-10): KnowFlowReview.swift, its
      # registration and pbxproj entries, ios-smoke proof 14, the signed-in rate-row
      # and review-gate readings, and scripts/ios/review_proof.py --self-test.
      - name: Verify Sign in with Apple, native half (plugin, entitlement, CI proofs)
        run: node --experimental-strip-types scripts/verify-apple-native.mjs

      # Universal links, item 4g PR 1 (web/server, no ios/): the AASA's appID, ONE
      # component, the catch-all exclude (item 4j: the build 9 reset mail did
      # nothing in Gmail, so no link opens the app), webcredentials, a URL table
      # under Apple's first-match rule (module matcher and an independent one;
      # every mail-link shape incl. an empty locale= goes to the browser), forced
      # cases (the #343-#355 file must fail it), the force-static route's 200/JSON/no-Location answer,
      # the middleware matcher skipping the path, the Smart App Banner in
      # (site)/layout.tsx only with the app-id from APPLE_APP_APPLE_ID, and the
      # monitor probe. 51 failures on main a28a444.
      - name: Verify universal links (the AASA allowlist, its route, the web-only Smart App Banner)
        run: node --experimental-strip-types scripts/verify-universal-links.mjs

      # In-app rating, item 4h PR 1 (web only, no ios/; dormant until PR 2's
      # KnowFlowReview plugin): every decide() boundary (tenure 2/3 days, wins
      # 1/2, 2/5 vs 3/5 and a 2-question quiz, same/new version, 119/120 days,
      # setback today/yesterday, clock moved back), the kf-review store's failure
      # modes (missing, corrupt, wrong v, throwing localStorage: no ask), the gate
      # (web, shell 1, Android, shell 2 without the plugin, forged UA: null), the
      # trigger's sequence (request only after the wait, the live checks with a
      # closed Sheet not blocking, and a held "asked" write), and the sources:
      # request() from ReviewTrigger only, no handler reaching it, the write-review
      # URL once, no reward word, the Settings row last in Help and legal, the
      # approved strings (app v15), one counted result per day (lastWin). 44 failures on main e7948da.
      - name: Verify the in-app rating (the rules, the device record, the gate, one trigger, the Settings link)
        run: node --experimental-strip-types scripts/verify-review.mjs

      # Register #113. Imports the real upload estimate (measured rate, stages, the
      # 90% cap) and reads DropZone for the progress transport and the #50/#111 checks.
      - name: Verify the upload shows real progress and an honest estimate (register #113)
        run: node --experimental-strip-types scripts/verify-upload-progress.mjs

      # Register #85. Imports the real per-subject stats and suggestion builders,
      # renders the real subjects, subject-header and material-card components, and
      # reads the Ask and home wiring; the spec must exist with its three parts.
      - name: Verify the signed-in screens carry progress, a study kit and suggested questions (register #85)
        run: node --experimental-strip-types scripts/verify-signed-in-features.mjs

      # Item 4j, tap feedback: the five loading.tsx skeletons (and no other one under
      # the dashboard), no text and no spinner in them, singleFlight run with its
      # forced cases, every listed button wrapped (each unwrapped copy flagged), the
      # pending tab, the subject page's wait. design-c checks 32 and 33 are the renders.
      - name: Verify a tap changes the screen at once and a button cannot fire twice (item 4j)
        run: node --experimental-strip-types scripts/verify-tap-feedback.mjs

      # Item 4j, region: functions in dub1 next to Supabase eu-west-1 and nothing else
      # in vercel.json moved; Server-Timing (db + total, whole ms) on the five routes,
      # overlapping calls counted once; one kf-timing log line per dashboard render.
      - name: Verify the functions run next to the database and measure their wait (item 4j)
        run: node --experimental-strip-types scripts/verify-server-timing.mjs && node --experimental-strip-types scripts/verify-server-timing.mjs --self-test

      # Register #121: six defects seen on production 2026-09-25 (the Apple gate, the
      # RTL canvas, the Continue card bidi, content-based suggestions, one date
      # format, the material action grid), each held here.
      - name: Verify the six production defects of 2026-09-25 stay fixed (register #121)
        run: node --experimental-strip-types scripts/verify-production-defects.mjs

      # The visual language (docs/design/VISUAL_LANGUAGE.md): the palette in three
      # scopes, motion behind the reduced-motion guard, original illustrations,
      # rings for numbers, a picture on every panel; rendered, not grepped.
      - name: Verify the visual language holds (VISUAL_LANGUAGE.md)
        run: node --experimental-strip-types scripts/verify-visual-system.mjs

      # The landing showpiece (Part C): renders the real page in both locales for its
      # five sections, pictures, reveals, parallax shapes and hero beats; every
      # start state inside the reduced-motion guard; the client files small.
      - name: Verify the landing shows the product working and is still there with motion off
        run: node --experimental-strip-types scripts/verify-landing.mjs

      # Register #122: seven review points after #205-#207 (step pictures, one
      # picture per card, the empty ring, standard Arabic months, the Ask screen,
      # the platform label, the auth pages) and the Arabic strings export.
      - name: Verify the seven review points of 2026-09-25 stay fixed (register #122)
        run: node --experimental-strip-types scripts/verify-production-review-2.mjs

      - name: Verify design-c's before_ref guard and the signed-in login's one retry (offline)
        run: node scripts/verify-ci-guards.mjs

      # Item 4i, PR 3: store_setup.py's 1.1 screenshots mode, offline (no
      # network, no key): the 48 planned uploads (4 locales x 2 display types
      # x 6 files), a resumed half-done set, old images deleted only after the
      # new ones are COMPLETE, and every refusal on its planted case (1.0.1
      # and 1.0 by name before the auth file, READY_FOR_SALE, wrong pixel
      # size, missing or extra file, unknown display type, a full set).
      - name: Verify the App Store 1.1 screenshots upload plan and its refusals (offline, item 4i)
        run: python3 -I scripts/asc/verify_screens_1_1.py

      # Register #123: the owner's approved Arabic microcopy batches (docs/copy/
      # ARABIC_STRINGS_*_v*.md) hold in ar.ts, and the key set, every placeholder
      # and Western digits are unchanged. A new batch file is picked up with no edit here.
      - name: Verify the approved Arabic copy holds and the key set and placeholders are unchanged (register #123)
        run: node --experimental-strip-types scripts/verify-arabic-copy.mjs

      # #124: every file name on screen goes through FileName, "الفصل 3.pdf" keeps
      # "3.pdf" one unit, and the rendered text is byte-identical to the stored name.
      - name: Verify a file name with a chapter number reads in order, on every site that shows one (register #124)
        run: node --experimental-strip-types scripts/verify-filename-display.mjs

      # 2026-11-03 phone test: a subject name is shown in its own direction (a
      # Latin name truncates at its own end) and stays one piece in a sentence.
      - name: Verify a subject name reads in its own direction wherever it is shown (UserName)
        run: node --experimental-strip-types scripts/verify-user-names.mjs

      # Activation fix 1 (2026-11-09 audit): a created subject opens on its own
      # page, and the home's step 2 opens the newest subject while it has no file.
      - name: Verify a new subject opens on its upload tile, and step 2 leads there (activation fix 1)
        run: node --experimental-strip-types scripts/verify-activation-1.mjs

      # Activation fix 2 (2026-11-09 audit, cause #4): with no material the three
      # steps lead the home and the Ask card follows; with one, today's order.
      - name: Verify the three steps lead the home until the first material, then today's order (activation fix 2)
        run: node --experimental-strip-types scripts/verify-activation-2.mjs

      # Activation fix 3 (2026-11-09 audit, cause #2): in the app, a signed-out
      # visitor on a device that never held a session opens on sign-up, one that
      # did (kf-seen=1) on login; the web is unchanged. Real middleware, fetch stubbed.
      # Part 4 (activation fix 4): the app's sign-up says what the app does
      # (about.subtitle in the slot the web gives cta.note), the web unchanged.
      - name: Verify the app opens on sign-up on a fresh device and on login after a session, its sign-up says what the app does, the web unchanged (activation fixes 3 and 4)
        run: node --experimental-strip-types scripts/verify-activation-3.mjs

      # Activation fix 5 (audit causes #6, #10, #7), against the REAL /api/agent
      # and /api/ingest handlers with an in-memory database: asking in a subject
      # with no file to answer from counts nothing and calls no model; a failed
      # processing does not use one of the day's uploads, and failed attempts
      # stop at 5 + 5 a day; the picked file is held through the permission
      # sheet and released on "Not now". 43 failures on main eec2b18.
      - name: Verify zero material costs no question, a failed processing costs no upload (bounded), and the picked file survives the permission sheet (activation fix 5)
        run: node --experimental-strip-types scripts/verify-activation-5.mjs

      # Latin runs in a right-to-left sentence (the drop zone's messages and
      # the AI permission sheet): each a left-to-right isolate, a short one
      # (30 characters or fewer) on one line, every string unchanged. 30
      # failures on main 5aab762 (no splitLatinRuns, no LatinText).
      - name: Verify Latin runs in the drop zone and the AI sheet stay whole and in order, with the strings unchanged
        run: node --experimental-strip-types scripts/verify-latin-runs.mjs

      # Audit cause #8: sign-up, sign-in and the new-password page show a
      # sentence of ours in the page's language, chosen by the error's code
      # (src/lib/auth/auth-error.ts), never GoTrue's English; the real
      # supabase-js client against design-c's fixtures; no account is named.
      # Cause #3: the app's line under the check-inbox notice. 9 failures on
      # main 155cff5 (no mapper, the three pages show `.message`).
      - name: Verify auth errors are ours, in the page's language, and name no account
        run: node --experimental-strip-types scripts/verify-auth-errors.mjs

      # Audit cause 9 (docs/plans/sample-file.md): the sample file's embeddings
      # are computed once and committed, so they are only right while the PDFs,
      # the model and the chunker are the committed ones and main.py's. Passes
      # with "not generated yet" until the JSON files land; its forced cases
      # (a changed PDF, model, chunk size, overlap, or JSON) must each fail.
      - name: Verify the sample file's PDFs and embedding settings have not drifted
        run: node scripts/verify-sample-file.mjs && node scripts/verify-sample-file.mjs --self-test

      # Audit cause 9, the feature: the day's uploads leave the sample out; the
      # REAL /api/sample handler, against an in-memory database, refuses without
      # the AI permission before any write, is idempotent, holds the subject
      # limit, stores the committed PDF and chunks in one insert, undoes a
      # failed attempt and never touches a usage counter; the button is drawn
      # only at zero material and the ready question only fills the field. Its
      # forced cases (the sample counted, the permission skipped, a second
      # sample) must each fail.
      - name: Verify the sample file feature (the route, the rows, the day's uploads)
        run: node --experimental-strip-types scripts/verify-sample-feature.mjs && node --experimental-strip-types scripts/verify-sample-feature.mjs --self-test

      # #295 follow-up: /api/ingest never stores a file name holding U+0000 (22P05).
      - name: Verify the upload route removes U+0000 from the stored file name, and nothing else
        run: node --experimental-strip-types scripts/verify-upload-filename-nul.mjs

      # Option C (no OCR): a PDF with some pages without text says how many and
      # how to get the text; one with none keeps its no-text state, plus that line.
      - name: Verify the material card and the upload result report pages with no text
        run: node --experimental-strip-types scripts/verify-no-text-pages.mjs

      # #130: the REAL auth callback, with only the Supabase route client stubbed.
      # A refused reset link lands on /login?notice=recovery_expired, which the
      # login page renders with a link to forgot-password; every other link,
      # success and failure lands exactly as before. #131: a mail link /verify
      # refused (otp_expired) gets link_expired and its error fragment is cleared.
      - name: Verify a failed reset or signup link gets its notice and every other auth landing is unchanged (register #130, #131)
        run: node --experimental-strip-types scripts/verify-recovery-link-notice.mjs

      # #135: the REAL auth callback through the REAL @supabase/ssr and auth-js,
      # with only GoTrue's network answer stubbed, so the success 307 under test
      # is the one production sends: its session cookies carry Secure, every
      # writer of those cookies passes the same flags, and the refused 307s set
      # no cookie.
      - name: Verify the session cookies' flags on the real success 307 and every writer (register #135)
        run: node --experimental-strip-types scripts/verify-session-cookies.mjs

      # Apple 5.1.2(i), STORE_PATH.md S4: the REAL four AI routes refuse an
      # account without the permission before any counter, storage, ingestion,
      # embedding or model call, let one with it through, still serve a stored
      # summary or quiz; the four call sites ask before they send; both
      # dictionaries and the privacy policy name Anthropic and Voyage AI.
      - name: Verify nothing reaches Anthropic or Voyage AI before the student's permission (Apple 5.1.2(i))
        run: node --experimental-strip-types scripts/verify-ai-consent.mjs

      # STORE_PATH.md S3(a) and ITMS-91053: the study reminder is the app's
      # alone, off at 19:00, asks for the permission only at its switch and
      # carries no purchase word; the privacy manifest is in the app target and
      # declares what the audit found. The native half is ios-smoke.yml.
      - name: Verify the study reminder and the app's privacy manifest (Apple 4.2, ITMS-91053)
        run: node --experimental-strip-types scripts/verify-study-reminder.mjs

      # Path A (no third-party login in the app): the login page inside the app
      # tells a Google-registered student to set a password with its own forgot
      # link; the web, which has the Google button, does not show the line.
      - name: Verify the login line for Google-registered students, inside the app only
        run: node --experimental-strip-types scripts/verify-google-hint.mjs

      # The store screenshots of 2026-10-09: a stored summary spans the material
      # card's row on a phone and reads in its own direction on either page.
      - name: Verify a summary spans its card and keeps its own text direction
        run: node --experimental-strip-types scripts/verify-summary-layout.mjs

      # fix/paddle-safety: the webhook grants Pro only for PADDLE_PRO_PRICE_ID at
      # quantity 1, compares the signature in constant time, and never lets an
      # older event overwrite a newer one. The checkout and webhook failure
      # proofs (registers #72b, #72c) existed but no workflow ran them.
      - name: Verify the Paddle webhook's safety rules and the billing failure paths
        run: |
          node --experimental-strip-types scripts/verify-paddle-webhook-safety.mjs
          node --experimental-strip-types scripts/verify-webhook-failure-classification.mjs
          node --experimental-strip-types scripts/verify-checkout-route.mjs
          node --experimental-strip-types scripts/verify-checkout-error-classification.mjs

      # fix/ai-cost-caps: a question over 4,000 characters is refused before the
      # consent check and the counter; Pro uploads are 20 a day; the ingestion
      # service's content-cap refusal reaches the student as too-much-text; the
      # two sentences are the drafts in docs/copy-drafts/ai_cost_caps.md. The
      # service half (text and archive caps) is services/ingestion/tests/
      # test_content_caps.py, run by the ingestion-image workflow.
      - name: Verify the question length cap, the Pro upload cap and the too-much-text refusal
        run: node --experimental-strip-types scripts/verify-ai-cost-caps.mjs

      # feat/ai-allowance: at an account's 30-day USD ceiling every question,
      # summary, quiz and upload is refused before the daily counter and the
      # provider, and is not recorded; under it, the real price of each billed
      # call is recorded by the server. The ledger's grants, RLS and checks are
      # public-grants section 5; the service's Voyage count is
      # services/ingestion/tests/test_voyage_tokens.py (ingestion-image).
      - name: Verify the monthly AI allowance refuses before any provider call and records what was billed
        run: node --experimental-strip-types scripts/verify-ai-allowance.mjs

      # feat/page-reader ("photograph your pages"): POST /api/page-read reads up
      # to ten photos the app put in the student's own storage folder with
      # Claude Haiku 5.5 (G2's settings, mocked here: no model call) and hands
      # ONE .md file to the shared ingestion. Held: the model's text reaches
      # the material byte for byte (G2's two silent edits, unfixed and
      # unedited); image bombs and HEIC refused from the header before any
      # decoder; EXIF orientation applied and stripped; a foreign key refused
      # before anything is read or deleted; the allowance reserves 0.0025 USD
      # a photo before anything is sent; an unreadable ledger is a 503; every
      # billed call is recorded at its real price; the real SDK 0.39 puts the
      # route's request on the wire unchanged. --self-test plants ten edits
      # the byte-exact check must catch. The ledger kind's SQL is
      # public-grants section 6.
      - name: Verify the page reader keeps the model's text exactly, refuses unsafe photos and reserves before it reads
        run: node --experimental-strip-types scripts/verify-page-reader.mjs && node --experimental-strip-types scripts/verify-page-reader.mjs --self-test

      # fix/page-photo-sweep: a camera batch whose POST never came stays in
      # storage (no delete policy). After the answer, /api/page-read (once the
      # keys are the caller's) and /api/ingest (once the session is checked)
      # remove the CALLER'S OWN batches whose newest photo is an hour old.
      # Held: the current batch and a fresher one kept; another user's prefix
      # never listed; nothing outside {userId}/page-photos/{uuid}/ removed;
      # at most 5 batches / 50 photos / 6 lists (inside 3 s) / 1 remove per
      # request; a malformed id lists nothing; every storage failure is logged;
      # the routes only schedule it with after(), so their answer is unchanged.
      - name: Verify the page-photo sweep removes only the caller's own stale batches and never changes an answer
        run: node --experimental-strip-types scripts/verify-page-photo-sweep.mjs

      # fix/storage-server-writes (storage insert lockdown, stage 1): every file
      # in the documents bucket is written and rolled back by the SERVER with the
      # service role, after the key ({uid}/{kbId}/{documentId}/{name}, the
      # caller first) and the subject (the caller's, read under RLS) are proved.
      # Held: ingestMaterial and /api/sample keep the same key, options and
      # sentences; a foreign subject, a failed read, no service role and a
      # storage error write nothing; the sample rollback now removes the file;
      # and a guard over src/ finds no storage write by anything but `admin`
      # in the five files allowed one (--self-test plants six it must catch).
      - name: Verify every stored file is written by the server after the caller's checks, and no student-session storage write is left
        run: node --experimental-strip-types scripts/verify-storage-server-writes.mjs && node --experimental-strip-types scripts/verify-storage-server-writes.mjs --self-test

      # feat/camera-screen ("صوّر صفحاتك", the app only): the camera tile is
      # rendered for the app at shell 2 (KnowFlowApp/2, which declares
      # NSCameraUsageDescription) and never for the web or build 8, whose
      # markup stays byte for byte; every key uploaded matches the INSERT and
      # DELETE policies production has (read from the applied migration);
      # a batch read at most once (item 4j: an unanswered POST is asked once
      # more with the same keys and kept, never deleted once posted; an upload
      # retry is a new batch, a failed upload is deleted); only
      # /api/page-read needs the photos permission (version 2); EXIF read and
      # every orientation's transform; the new strings' rules.
      - name: Verify the camera screen is gated to shell 2, uploads only policy keys and posts each batch once
        run: node --experimental-strip-types scripts/verify-camera-screen.mjs

      # Item 4j (build 9, the first camera send after the photos permission
      # held "reading" 13 minutes with no request at Vercel): the reading line
      # shows only after fetch() was called in the same turn, the permission
      # sheet releases its caller as soon as the save answers, and the read
      # carries the phone's timeline in its query (kf_t, kf_c, kf_s, kf_u,
      # kf_r; digits only), which the route writes in one kf-page-read-arrival
      # log line with its own arrival time and otherwise ignores.
      - name: Verify the camera's read is issued with the reading line and carries its timeline
        run: node --experimental-strip-types scripts/verify-camera-read-timeline.mjs

      # Item 4j, the fix: /api/page-read CLAIMS a batch (a service-role
      # kf-claim object, upsert false) before any model call, so of 2 or 5
      # requests for one batch at once exactly one is read and billed and the
      # rest are 409 page-batch-taken having touched nothing; a refusal lets
      # the claim go (410 page-batch-gone on asking again). The app's read has
      # a 75 s limit and asks ONCE more with the same keys; "Try again" after
      # unconfirmed asks again and never uploads unless 410; Close works while
      # reading. --self-test plants a claim that never refuses and must read twice.
      - name: Verify a camera batch is read at most once and an unanswered send is asked again, not re-uploaded
        run: node --experimental-strip-types scripts/verify-page-batch-once.mjs && node --experimental-strip-types scripts/verify-page-batch-once.mjs --self-test

      # The camera screen's encoder in a real browser (Chromium, as design-c):
      # photos tagged EXIF 1, 3, 6 and 8 come out upright (read from their own
      # pixels), 2300 px on the long side, baseline JPEG, no EXIF; and the
      # module's own transform turns stored pixels upright for all eight.
      - name: Install puppeteer-core for the encoder proof (outside the app)
        run: npm install --prefix "$RUNNER_TEMP/pp" --no-audit --no-fund --ignore-scripts puppeteer-core@23.11.1
      - name: Verify the camera screen's encoder turns photos upright, fits them to 2300 px and writes baseline JPEG
        run: CHROME="$(command -v google-chrome)" PUPPETEER_DIR="$RUNNER_TEMP/pp" node scripts/verify-page-photo-encode.mjs

      # iOS 1.1 item 4d, server half: the App Store JWS verifier (chain to a
      # pinned Apple Root CA - G3, ES256, marker OIDs, signedDate), the
      # purchase rules (bundle, the one product, Production or an allowlisted
      # Sandbox account, PURCHASED, appAccountToken = the account), every
      # notification type's state, Pro from Paddle OR Apple, and both routes
      # refusing a test-chain JWS because they can only use Apple's root. A
      # throwaway chain is made with openssl per run; no key is committed.
      # The database half is the apple-iap-db job.
      - name: Verify App Store purchases verify to Apple's pinned root only, and grant the one Pro product to the account that bought it
        run: node --experimental-strip-types scripts/verify-apple-iap.mjs

  # Register #125 (the proof of #72). Drives the REAL readEntitlement through the
  # REAL supabase-js against a throwaway Postgres + PostgREST in Docker holding
  # the subscriptions table's exact definition: a paying user with two rows must
  # resolve Pro, and a failed read must be logged and resolve free. It is its own
  # job because it needs Docker, which the `tsc` steps do not; Docker is on the
  # ubuntu-24.04 image, the repository is public, so the minutes are free.
  #
  # REQUIRED CHECK (register #125, 2026-09-25): branch protection on `main`
  # requires this job by its name, `entitlement-read`, beside `tsc` and `db-types`,
  # enforced on admins too, so a red run blocks the merge button. A required
  # context that never reports blocks every PR: renaming or removing this job,
  # or giving it a path filter or an `if:`, must update the protection in the
  # same sitting.
  entitlement-read:
    needs: detect
    if: ${{ !cancelled() && needs.detect.outputs.code != 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify a paying user with two subscription rows is never resolved free (register #72, #125)
        run: node --experimental-strip-types scripts/verify-entitlement-plural-read.mjs

  # Register #126 (b). The half of #126 that needs no production: against
  # Supabase's own postgres image (db-types' digest) with every migration applied
  # in the manifest's order, and PostgREST with a JWT secret generated for the
  # run, a signed-in user reads their own subscriptions row and nobody else's,
  # anon reads nothing, and no signed-in or anonymous request can INSERT, UPDATE,
  # UPSERT or DELETE a row, their own included. It also prints the catalog rows
  # (RLS, policies, grants, auth.uid()) that register #126 (a) compares against
  # production with the same query, scripts/sql/read-subscriptions-rls.sql.
  #
  # ITS OWN JOB, NOT A STEP OF entitlement-read, for three reasons: that job is
  # a REQUIRED check and a required check's scope must not grow by a step that
  # protection never reviewed; this one pulls a different, 1.7 GB image whose
  # failure would then be indistinguishable from an entitlement failure; and the
  # two run in parallel, so the workflow's wall clock does not move.
  #
  # REQUIRED CHECK (register #126, 2026-09-26): branch protection on `main`
  # requires this job by its name, `entitlement-rls`, beside `tsc`, `db-types`
  # and `entitlement-read`, enforced on admins too, after its first green run on
  # main (30899a2). The same trap as entitlement-read: a required context that
  # never reports blocks every PR, so renaming or removing this job, or giving
  # it a path filter or an `if:`, must update the protection in the same sitting.
  entitlement-rls:
    needs: detect
    if: ${{ !cancelled() && needs.detect.outputs.code != 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the subscriptions read path under the migrations' RLS, as authenticated and anon (register #126)
        run: node --experimental-strip-types scripts/verify-subscriptions-rls.mjs

  # Register #137 (PR A). The write grants of schema `public`, table by table
  # and role by role, against Supabase's own postgres image (db-types' digest)
  # with every migration applied in the manifest's order, and PostgREST with a
  # JWT secret generated for the run: the declared intended-writers matrix
  # (15 tables x anon/authenticated/service_role x SELECT/INSERT/UPDATE/DELETE)
  # is asserted line for line against the SAME statement the production read
  # uses (scripts/sql/read-public-grants.sql), so a migration that creates a
  # table and forgets its REVOKE, or a REVOKE that over-reaches, goes red; the
  # policy set per table is asserted by name; every write PR A forbids must
  # answer `42501 permission denied for table` through PostgREST with the
  # table byte-identical (a row-security refusal is NOT accepted: it has the
  # same code and different words); and the real write paths must still work
  # as the signed-in student: the two SECURITY DEFINER functions
  # (`increment_usage`, `record_study_event`) and every verb `authenticated`
  # keeps on the other tables. It also prints the fixture's full catalog read,
  # the expected side the production read is compared with after each apply.
  #
  # ITS OWN JOB, for the reasons entitlement-rls gives: a required check's
  # scope must not grow by a step protection never reviewed; it pulls the same
  # 1.7 GB image (cached by the runner's layer cache when both run); and it
  # runs in parallel, so the workflow's wall clock does not move.
  #
  # REQUIRED CHECK (register #137): branch protection on `main` is to require
  # this job by its name, `public-grants`, beside `tsc`, `db-types`,
  # `entitlement-read` and `entitlement-rls`, enforced on admins too, after its
  # first green run on main. The same trap as the others: a required context
  # that never reports blocks every PR, so renaming or removing this job, or
  # giving it a path filter or an `if:`, must update the protection in the
  # same sitting.
  public-grants:
    needs: detect
    if: ${{ !cancelled() && needs.detect.outputs.code != 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the write grants of schema public, the policy set, every forbidden write refused and every real write path alive (register #137)
        run: node --experimental-strip-types scripts/verify-public-grants.mjs

  # Storage lockdown, stage 2: supabase/migrations/20261118_storage_lockdown_production.sql
  # (supersedes the never-applied 20261118_storage_insert_lockdown.sql; applied
  # to production BY HAND) against Supabase's postgres image AND the real
  # Storage API (supabase/storage-api v1.89.5, pinned by digest), which creates
  # the storage schema the bare image lacks. It STARTS FROM PRODUCTION'S FIVE
  # POLICIES (two from 002_storage.sql, three made by hand, from the
  # migration's PRODUCTION-BEFORE record). Uploads and deletes go over HTTP
  # with run-only JWTs: before it, the holes (any key, 30 MiB, a material's
  # file deleted by its student); after it, both student INSERT policies gone,
  # an upload outside {own uid}/page-photos/{uuid}/{name} refused, inside
  # allowed, the 101st refused, a student delete only of their own photos, 25
  # MiB + 1 refused for every role, the service role otherwise unaffected,
  # reads through "Users can read own files" alone, and the migration's VERIFY
  # query answering its seven expected rows. Then the same proof with no
  # migration and with the superseded file must FAIL. Its own job, NOT
  # required (a new check proves itself on main first, as public-grants did).
  storage-lockdown:
    needs: detect
    if: ${{ !cancelled() && needs.detect.outputs.code != 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1

      - name: Verify the storage lockdown from production's five policies against the real Storage API (camera-only student uploads, 100 at most, student deletes of own photos only, 25 MiB bucket limit)
        run: node --experimental-strip-types scripts/verify-storage-lockdown.mjs

      - name: The same proof must FAIL with no migration, and with the superseded 20261118_storage_insert_lockdown.sql instead
        run: |
          for plant in skip old; do
            if KF_LOCKDOWN_PLANT=$plant node --experimental-strip-types scripts/verify-storage-lockdown.mjs > "plant-$plant.log" 2>&1; then
              echo "KF_LOCKDOWN_PLANT=$plant PASSED: the proof does not depend on the migration"; cat "plant-$plant.log"; exit 1
            fi
            echo "KF_LOCKDOWN_PLANT=$plant failed, as it must:"; grep -E '^PLANT|FAIL|passed,' "plant-$plant.log"
          done

  # iOS 1.1 item 4d, server half: supabase/migrations/20261118_apple_subscriptions.sql
  # (applied to production BY HAND before the merge) against Supabase's postgres
  # image with every migration in the manifest's order, and PostgREST with
  # run-only JWTs. The migration's own VERIFY query must answer its twelve
  # rows, twice (idempotent); no student or anon write and no service-role
  # DELETE; the REAL handlers of POST /api/apple/iap/verify and POST
  # /api/apple/notifications (with a throwaway root injected) grant, renew,
  # grace, retry, expire, refund, revoke, ignore unknown types, refuse forged,
  # foreign and Sandbox-off-list data, and stay idempotent and ordered under
  # replay and out-of-order delivery; Paddle and Apple coexist on one account
  # with the Paddle row byte-identical. Then the same proof with the migration
  # left out must FAIL. Its own job, NOT required (a new check proves itself
  # on main first, as public-grants did).
  apple-iap-db:
    needs: detect
    if: ${{ !cancelled() && needs.detect.outputs.code != 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the Apple subscriptions table, its grants and both Apple routes' writes on real Postgres, beside Paddle
        run: node --experimental-strip-types scripts/verify-apple-subscriptions-db.mjs

      - name: The same proof must FAIL without the migration
        run: |
          if KF_APPLE_PLANT=skip node --experimental-strip-types scripts/verify-apple-subscriptions-db.mjs > plant-skip.log 2>&1; then
            echo "KF_APPLE_PLANT=skip PASSED: the proof does not depend on the migration"; cat plant-skip.log; exit 1
          fi
          echo "KF_APPLE_PLANT=skip failed, as it must:"; grep -E 'FAIL|passed,' plant-skip.log | head -40
