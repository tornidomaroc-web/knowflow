name: tmp-build-probe
# TEMPORARY (Step Wording-1): the Vercel preview of PR #260 failed with no
# readable log; this reproduces a clean Linux install and build. Removed
# before merge.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      VERCEL_ENV: preview
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-not-a-key
      NEXT_PUBLIC_SITE_URL: https://tryknowflow.com
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npx next build 2>&1 | tee "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}
