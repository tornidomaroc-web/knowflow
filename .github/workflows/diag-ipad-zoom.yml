name: diag-ipad-zoom

# DIAGNOSTIC — branch diag/ipad-zoom ONLY; never merged, no PR.
#
# Guideline 4.0 (1.0 build 7 rejected on an iPad Air 11-inch (M3)): does a REAL
# tap on a 14 px field zoom the web view, and does the zoom survive a
# client-side navigation? iPad Air 11-inch (M3) running the iPhone-only app in
# compatibility mode first, then a 6.9-inch iPhone baseline, in one run.
#
# Signed out only: no environment, no secret, no account, no sign-in, nothing
# typed, no AI call. Taps are XCUITest touches through the accessibility tree
# (ios/diag/KFZoomUITests), never JavaScript focus(). Readings come from the
# app's DEBUG+simulator hook (MainViewController.swift, ZoomDiag).
#
# Third design (run 40143915184 failed: XCUIApplication.launch() timed out on
# the iPhone, and `bash -e` then skipped the iPad):
# - one simulator booted at a time (boot, bootstatus -b, test, shut down);
# - the app is ad-hoc signed (CODE_SIGN_IDENTITY=-);
# - the app is opened by `simctl launch` with SIMCTL_CHILD_KF_DIAG=1, as
#   ios-smoke opens it; the UI test only attaches (activate()), one fresh
#   launch per half (email, then password);
# - with or without the UI test, each launch leaves simctl screenshots and the
#   hook's own files (kfdiag-native.json: screen, window and web view frame at
#   launch; kfdiag.jsonl: every changed reading);
# - `set +e` in the device loop: each device and half is recorded on its own.
#
# Trigger: a push to this branch (a workflow that is not on main cannot be
# dispatched). The branch is pushed once.

on:
  push:
    branches: [diag/ipad-zoom]

permissions:
  contents: read

concurrency:
  group: diag-ipad-zoom
  cancel-in-progress: false

jobs:
  zoom:
    name: iOS — focus-zoom measurement, iPad Air 11-inch (M3) compat then iPhone 6.9-inch (signed out)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # FAIL FAST 1: both device types exist on this image. Created, not booted.
      - name: Create the two simulators (not booted)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out"
          xcodebuild -version
          rt=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("platform")=="iOS" and x.get("isAvailable")]; r.sort(key=lambda x:[int(p) for p in x["version"].split(".")]); print(r[-1]["identifier"])')
          types=$(xcrun simctl list devicetypes -j)
          ipad=$(echo "$types" | python3 -c 'import json,sys; d=[x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"]=="iPad Air 11-inch (M3)"]; print(d[0] if d else "")')
          # 6.9-inch: the newest "Pro Max" (16 Pro Max and later are 6.9-inch).
          iphone=$(echo "$types" | python3 -c 'import json,re,sys; d=[(int(m.group(1)),x["identifier"],x["name"]) for x in json.load(sys.stdin)["devicetypes"] for m in [re.match(r"iPhone (\d+) Pro Max$",x["name"])] if m and int(m.group(1))>=16]; d.sort(); print(d[-1][1] if d else "")')
          echo "runtime=$rt"; echo "iphone type=${iphone:-MISSING}"; echo "ipad type=${ipad:-MISSING}"
          test -n "$ipad" || { echo "FAIL FAST: iPad Air 11-inch (M3) is not a device type on this image"; exit 1; }
          test -n "$iphone" || { echo "FAIL FAST: no 6.9-inch iPhone device type on this image"; exit 1; }
          U_IPAD=$(xcrun simctl create kf-ipad "$ipad" "$rt")
          U_IPHONE=$(xcrun simctl create kf-iphone "$iphone" "$rt")
          echo "U_IPHONE=$U_IPHONE" >> "$GITHUB_ENV"; echo "U_IPAD=$U_IPAD" >> "$GITHUB_ENV"
          printf 'runtime %s\nipad %s %s\niphone %s %s\n' "$rt" "$ipad" "$U_IPAD" "$iphone" "$U_IPHONE" | tee "$RUNNER_TEMP/out/devices.txt"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      # The project's local Swift package (CapApp-SPM) points into node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Add the UI test target (runner checkout only)
        run: |
          set -eu
          ruby -v
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          mkdir -p ios/App/KFZoomUITests
          cp ios/diag/KFZoomUITests/KFZoomUITests.swift ios/App/KFZoomUITests/
          ruby ios/diag/add_uitest_target.rb

      - name: Resolve Swift packages
        run: |
          set -eu -o pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme KFZoom \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" 2>&1 | tail -n 5

      # FAIL FAST 2: the test target compiles (small) before the app (long).
      - name: Build the UI test runner (fails fast if the test does not compile)
        run: |
          set -eu -o pipefail
          xcodebuild build-for-testing -project ios/App/App.xcodeproj -scheme KFZoom -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/out/build-tests.log" | { grep -E '^(error|\*\*)|: error:' || true; }
          ls "$RUNNER_TEMP/dd/Build/Products" | tee -a "$RUNNER_TEMP/out/products.txt"

      - name: Build the app for the iOS Simulator (DEBUG, ad-hoc signed)
        run: |
          set -eu -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-app" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            build 2>&1 | tee "$RUNNER_TEMP/out/build-app.log" | { grep -E '^(error|\*\*)|: error:' || true; }
          app=$(find "$RUNNER_TEMP/dd-app/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -n "$app" || { echo "no App.app"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "UIDeviceFamily (1 = iPhone only): $(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$app/Info.plist" | tr -d '\n ')" | tee "$RUNNER_TEMP/out/device-family.txt"
          codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|Authority|flags' | tee "$RUNNER_TEMP/out/codesign.txt"

      # One simulator at a time, iPad first. Per device: boot, wait until fully
      # booted, install; then two halves (email, password), each a fresh
      # `simctl launch`, the fallback screenshot and hook files, the UI test
      # (attach only), the after screenshot; then shut down. `set +e`: a failure
      # is recorded and the next half and device still run.
      - name: Measure on the iPad, then on the iPhone
        run: |
          set +e
          set -u
          OUT="$RUNNER_TEMP/out"
          BID=com.knowflow.app
          shot() { xcrun simctl io "$1" screenshot "$OUT/$2.png" >/dev/null 2>&1 && echo "  shot $2.png" || echo "  shot $2.png FAILED"; }
          # A command with a wall-clock limit (macOS has no `timeout`).
          limit() { perl -e '$t=shift; $p=fork; if(!$p){exec @ARGV} $SIG{ALRM}=sub{kill "TERM",$p; sleep 5; kill "KILL",$p; print STDERR "LIMIT: killed after ${t}s\n"; exit 124}; alarm $t; waitpid $p,0; exit($?>>8)' "$@"; }
          for dev in ipad iphone; do
            [ "$dev" = ipad ] && u=$U_IPAD || u=$U_IPHONE
            echo "=== $dev ($u)"
            xcrun simctl boot "$u"; echo "boot exit $?"
            limit 600 xcrun simctl bootstatus "$u" -b > "$OUT/$dev-bootstatus.log" 2>&1; echo "bootstatus exit $?: $(tail -n 1 "$OUT/$dev-bootstatus.log")"
            xcrun simctl ui "$u" appearance dark
            xcrun simctl install "$u" "$APP_PATH"; echo "install exit $?"
            data=$(xcrun simctl get_app_container "$u" "$BID" data); echo "data container: $data"
            xcrun simctl spawn "$u" log stream --style compact --predicate 'process == "App"' > "$OUT/$dev-app.log" 2>&1 &
            logpid=$!
            for half in email password; do
              [ "$half" = email ] && t=test1Email || t=test2Password
              echo "--- $dev $half"
              find "$data/tmp" -name 'kfdiag*' -delete 2>/dev/null
              limit 180 env SIMCTL_CHILD_KF_DIAG=1 xcrun simctl launch "$u" "$BID" > "$OUT/$dev-$half-launch.log" 2>&1
              echo "simctl launch exit $?: $(head -c 200 "$OUT/$dev-$half-launch.log")"
              # Fixed wait for the login page (the hook sends the web view to
              # /ar/login): at most 90 s, read from the hook's own file.
              reached=no
              for i in $(seq 1 90); do
                j=$(find "$data/tmp" -maxdepth 3 -name kfdiag.jsonl 2>/dev/null | head -n 1)
                if [ -n "$j" ] && grep -qE '"path":"(\\/|/)ar(\\/|/)login".*"ready":"complete"' "$j"; then reached="yes after ${i}s"; break; fi
                sleep 1
              done
              sleep 4
              echo "login page: $reached"
              shot "$u" "$dev-$half-00-launch-baseline"
              n=$(find "$data/tmp" -maxdepth 3 -name kfdiag-native.json 2>/dev/null | head -n 1)
              [ -n "$n" ] && { cp "$n" "$OUT/$dev-$half-native-launch.json"; echo "  native at launch: $(cut -c1-600 "$n")"; } || echo "  NO kfdiag-native.json (the hook did not run)"
              limit 900 env TEST_RUNNER_KF_DEV=$dev xcodebuild test-without-building -project ios/App/App.xcodeproj -scheme KFZoom \
                -destination "id=$u" -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/$dev-$half.xcresult" \
                -only-testing:KFZoomUITests/KFZoomUITests/$t > "$OUT/$dev-$half-test.log" 2>&1
              echo "$dev $half: xcodebuild exit $?"
              grep -E 'KFTAP|Test Case|error:|failed|LIMIT' "$OUT/$dev-$half-test.log" | cut -c1-300 | head -n 40
              shot "$u" "$dev-$half-99-after-test"
              j=$(find "$data/tmp" -maxdepth 3 -name kfdiag.jsonl 2>/dev/null | head -n 1)
              [ -n "$j" ] && { cp "$j" "$OUT/$dev-$half-hook.jsonl"; echo "  hook readings: $(wc -l < "$j" | tr -d ' ')"; } || echo "  NO kfdiag.jsonl"
              xcrun simctl terminate "$u" "$BID"
            done
            kill "$logpid" 2>/dev/null
            grep -h 'KFDiag' "$OUT/$dev-app.log" | cut -c1-400 | head -n 4
            xcrun simctl shutdown "$u"; echo "shutdown exit $?"
          done
          exit 0

      - name: Export the screenshots and readings
        if: always()
        run: |
          set -u
          OUT="$RUNNER_TEMP/out"
          for dev in ipad iphone; do for half in email password; do
            r="$RUNNER_TEMP/$dev-$half.xcresult"
            [ -d "$r" ] || { echo "no result bundle for $dev $half"; continue; }
            mkdir -p "$RUNNER_TEMP/att-$dev-$half"
            xcrun xcresulttool export attachments --path "$r" --output-path "$RUNNER_TEMP/att-$dev-$half" || echo "export failed for $dev $half"
            python3 - "$RUNNER_TEMP/att-$dev-$half" "$OUT" <<'PY'
          import json, os, shutil, sys
          src, out = sys.argv[1], sys.argv[2]
          man = os.path.join(src, "manifest.json")
          if not os.path.exists(man):
              print("no manifest in", src); sys.exit(0)
          for test in json.load(open(man)):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  ext = os.path.splitext(a["exportedFileName"])[1]
                  base = name.split("_")[0] if name.count("_") >= 2 else os.path.splitext(name)[0]
                  dst = os.path.join(out, base + ("" if base.endswith(ext) else ext))
                  shutil.copy(os.path.join(src, a["exportedFileName"]), dst)
                  print("exported", os.path.basename(dst))
          PY
          done; done

      - name: The measurement table
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"
          python3 - "$OUT" <<'PY' | tee "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          out = sys.argv[1]
          allrows = {}
          for dev in ("ipad", "iphone"):
              print(f"\n## {dev}\n")
              for half in ("email", "password"):
                  nf = os.path.join(out, f"{dev}-{half}-native-launch.json")
                  if os.path.exists(nf):
                      n = json.load(open(nf)).get("native", {})
                      print("**{} launch, hook (no XCUITest)**: idiom={} model={} screen={} screenNative={} scale={} window={} windowFrame={} webFrame={} webInWindow={} zoomScale={}\n".format(
                          half, n.get("idiom"), n.get("model"), n.get("screen"), n.get("screenNative"), n.get("screenScale"), n.get("window"), n.get("windowFrame"), n.get("webFrame"), n.get("webInWindow"), n.get("zoomScale")))
                  else:
                      print(f"**{half} launch**: no hook native reading\n")
                  hf = os.path.join(out, f"{dev}-{half}-hook.jsonl")
                  if os.path.exists(hf):
                      hr = []
                      for l in open(hf, errors="replace"):
                          try: hr.append(json.loads(l))
                          except Exception: pass
                      allrows[f"{dev}-{half}-hook"] = hr
                      print(f"hook readings ({half}): {len(hr)}; path / vv scale / native zoom / active over time: " + ", ".join(
                          "{}:{}/{}/{}".format(r.get("seq"), (r.get("page") or {}).get("path") if isinstance(r.get("page"), dict) else "-",
                                               ((r.get("page") or {}).get("vv") or {}).get("s") if isinstance(r.get("page"), dict) else "-",
                                               (r.get("native") or {}).get("zoomScale"),
                                               (r.get("page") or {}).get("active") if isinstance(r.get("page"), dict) else "-") for r in hr[-25:]) + "\n")
              rows = []
              for half in ("email", "password"):
                  p = os.path.join(out, f"{dev}-{half}-test.log")
                  if os.path.exists(p):
                      for l in open(p, errors="replace"):
                          if "KFDIAG|" in l:
                              try: rows.append(json.loads(l.split("KFDIAG|", 1)[1]))
                              except Exception: pass
              allrows[dev] = rows
              if not rows:
                  print("XCUITest: no readings"); continue
              f = rows[0]; ru = f.get("runner", {})
              print("**runner (real device) sees**: idiom={} screen={} screenshotPx={} appWindowOnScreen={} webViewOnScreen={}\n".format(
                  ru.get("idiom"), ru.get("screen"), ru.get("screenshotPx"), ru.get("appWindowOnScreen"), ru.get("webViewOnScreen")))
              print("| step | path | vv scale | native zoom | active | kbd | iw×ih | vv w×h | vv offL,offT | scrollW/clientW | dpr | safe t,r,b,l | contentOffset | contentSize | overflow | note |")
              print("|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|")
              for r in rows:
                  pg = r.get("page") if isinstance(r.get("page"), dict) else {}
                  na = r.get("native", {}); vv = pg.get("vv") or {}
                  print("| {} | {} | {} | {} | {} | {} | {}×{} | {}×{} | {},{} | {}/{} | {} | {} | {} | {} | {} | {} |".format(
                      r.get("step"), pg.get("path"), vv.get("s"), na.get("zoomScale"), pg.get("active"), (r.get("runner") or {}).get("keyboardShown"),
                      pg.get("iw"), pg.get("ih"), vv.get("w"), vv.get("h"), vv.get("ol"), vv.get("ot"), pg.get("sw"), pg.get("cw"),
                      pg.get("dpr"), pg.get("safe"), na.get("contentOffset"), na.get("contentSize"), len(pg.get("over") or []), r.get("note", "")))
              fields = next((r["page"].get("fields") for r in rows if isinstance(r.get("page"), dict)), None)
              print(f"\nfield font sizes: {fields}")
          json.dump(allrows, open(os.path.join(out, "measurements.json"), "w"), indent=1, ensure_ascii=False)
          PY

      - name: Keep the renders and readings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipad-zoom-xcuitest-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 30
