name: diag-ipad-zoom

# DIAGNOSTIC — branch diag/ipad-zoom ONLY; never merged, no PR.
#
# Guideline 4.0 (1.0 build 7 rejected on an iPad Air 11-inch (M3)): does a REAL
# tap on a 14 px field zoom the web view, and does the zoom survive a
# client-side navigation? iPad Air 11-inch (M3) running the iPhone-only app in
# compatibility mode, plus a 6.9-inch iPhone baseline, in one run.
#
# Signed out only: no environment, no secret, no account, no sign-in, nothing
# typed, no AI call. Taps are XCUITest touches through the accessibility tree
# (ios/diag/KFZoomUITests), never JavaScript focus(). Readings come from the
# app's DEBUG+simulator hook (MainViewController.swift, ZoomDiag).
#
# Trigger: a push to this branch (a workflow that is not on main cannot be
# dispatched). The branch is pushed once.

on:
  push:
    branches: [diag/ipad-zoom]

permissions:
  contents: read

concurrency:
  group: diag-ipad-zoom
  cancel-in-progress: false

jobs:
  zoom:
    name: iOS — XCUITest focus-zoom measurement, iPhone 6.9-inch and iPad Air 11-inch (M3) compat (signed out)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # FAIL FAST 1: both simulators exist on this image; they boot while the rest builds.
      - name: Create and boot the two simulators
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out"
          xcodebuild -version
          rt=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("platform")=="iOS" and x.get("isAvailable")]; r.sort(key=lambda x:[int(p) for p in x["version"].split(".")]); print(r[-1]["identifier"])')
          types=$(xcrun simctl list devicetypes -j)
          ipad=$(echo "$types" | python3 -c 'import json,sys; d=[x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"]=="iPad Air 11-inch (M3)"]; print(d[0] if d else "")')
          # 6.9-inch: the newest "Pro Max" (16 Pro Max and later are 6.9-inch).
          iphone=$(echo "$types" | python3 -c 'import json,re,sys; d=[(int(m.group(1)),x["identifier"],x["name"]) for x in json.load(sys.stdin)["devicetypes"] for m in [re.match(r"iPhone (\d+) Pro Max$",x["name"])] if m and int(m.group(1))>=16]; d.sort(); print(d[-1][1] if d else "")')
          echo "runtime=$rt"; echo "iphone type=${iphone:-MISSING}"; echo "ipad type=${ipad:-MISSING}"
          test -n "$ipad" || { echo "FAIL FAST: iPad Air 11-inch (M3) is not a device type on this image"; exit 1; }
          test -n "$iphone" || { echo "FAIL FAST: no 6.9-inch iPhone device type on this image"; exit 1; }
          U_IPHONE=$(xcrun simctl create kf-iphone "$iphone" "$rt")
          U_IPAD=$(xcrun simctl create kf-ipad "$ipad" "$rt")
          echo "U_IPHONE=$U_IPHONE" >> "$GITHUB_ENV"; echo "U_IPAD=$U_IPAD" >> "$GITHUB_ENV"
          printf 'runtime %s\niphone %s %s\nipad %s %s\n' "$rt" "$iphone" "$U_IPHONE" "$ipad" "$U_IPAD" | tee "$RUNNER_TEMP/out/devices.txt"
          for u in "$U_IPHONE" "$U_IPAD"; do xcrun simctl boot "$u"; done

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      # The project's local Swift package (CapApp-SPM) points into node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Add the UI test target (runner checkout only)
        run: |
          set -eu
          ruby -v
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          mkdir -p ios/App/KFZoomUITests
          cp ios/diag/KFZoomUITests/KFZoomUITests.swift ios/App/KFZoomUITests/
          ruby ios/diag/add_uitest_target.rb

      - name: Resolve Swift packages
        run: |
          set -eu -o pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme KFZoom \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" 2>&1 | tail -n 5

      # FAIL FAST 2: the test target compiles (small) before the app (long).
      - name: Build the UI test runner (fails fast if the test does not compile)
        run: |
          set -eu -o pipefail
          xcodebuild build-for-testing -project ios/App/App.xcodeproj -scheme KFZoom -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/out/build-tests.log" | { grep -E '^(error|\*\*)|: error:' || true; }
          ls "$RUNNER_TEMP/dd/Build/Products" | tee -a "$RUNNER_TEMP/out/products.txt"
          xcodebuild -showdestinations -project ios/App/App.xcodeproj -scheme KFZoom 2>/dev/null | grep -E 'kf-(iphone|ipad)|Ineligible' | tee "$RUNNER_TEMP/out/destinations.txt" || true

      - name: Build the app for the iOS Simulator (DEBUG, unsigned, as ios-smoke builds it)
        run: |
          set -eu -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-app" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/out/build-app.log" | { grep -E '^(error|\*\*)|: error:' || true; }
          app=$(find "$RUNNER_TEMP/dd-app/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -n "$app" || { echo "no App.app"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "UIDeviceFamily (1 = iPhone only): $(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$app/Info.plist" | tr -d '\n ')" | tee "$RUNNER_TEMP/out/device-family.txt"

      - name: Install the app on both simulators
        run: |
          set -eu
          for u in "$U_IPHONE" "$U_IPAD"; do
            xcrun simctl bootstatus "$u" -b | tail -n 1
            xcrun simctl ui "$u" appearance dark
            xcrun simctl install "$u" "$APP_PATH"
            echo "installed on $u"
          done

      - name: Run the UI test on the iPhone, then on the iPad
        run: |
          set -u
          for dev in iphone ipad; do
            [ "$dev" = iphone ] && u=$U_IPHONE || u=$U_IPAD
            TEST_RUNNER_KF_DEV=$dev xcodebuild test-without-building -project ios/App/App.xcodeproj -scheme KFZoom \
              -destination "id=$u" -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/$dev.xcresult" \
              > "$RUNNER_TEMP/out/$dev-test.log" 2>&1
            echo "$dev: xcodebuild exit $?"
            grep -E 'KFTAP|Test Case|error|failed' "$RUNNER_TEMP/out/$dev-test.log" | cut -c1-300 | head -n 40
          done
          exit 0

      - name: Export the screenshots and readings
        if: always()
        run: |
          set -u
          OUT="$RUNNER_TEMP/out"
          for dev in iphone ipad; do
            [ -d "$RUNNER_TEMP/$dev.xcresult" ] || { echo "no result bundle for $dev"; continue; }
            mkdir -p "$RUNNER_TEMP/att-$dev"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$dev.xcresult" --output-path "$RUNNER_TEMP/att-$dev" || echo "export failed for $dev"
            python3 - "$RUNNER_TEMP/att-$dev" "$OUT" <<'PY'
          import json, os, shutil, sys
          src, out = sys.argv[1], sys.argv[2]
          man = os.path.join(src, "manifest.json")
          if not os.path.exists(man):
              print("no manifest in", src); sys.exit(0)
          for test in json.load(open(man)):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  ext = os.path.splitext(a["exportedFileName"])[1]
                  base = name.split("_")[0] if name.count("_") >= 2 else os.path.splitext(name)[0]
                  dst = os.path.join(out, base + ("" if base.endswith(ext) else ext))
                  shutil.copy(os.path.join(src, a["exportedFileName"]), dst)
                  print("exported", os.path.basename(dst))
          PY
          done

      - name: The measurement table
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"
          python3 - "$OUT" <<'PY' | tee "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          out = sys.argv[1]
          allrows = {}
          for dev in ("iphone", "ipad"):
              p = os.path.join(out, dev + "-test.log")
              rows = []
              if os.path.exists(p):
                  for l in open(p, errors="replace"):
                      if "KFDIAG|" in l:
                          try: rows.append(json.loads(l.split("KFDIAG|", 1)[1]))
                          except Exception: pass
              allrows[dev] = rows
              print(f"\n## {dev}\n")
              if not rows:
                  print("no readings"); continue
              f = rows[0]; n = f.get("native", {}); ru = f.get("runner", {})
              print("**first reading** — app sees: idiom={} model={} screen={} window={} windowFrame={} webInWindow={} windowSafe={} | runner (real device) sees: idiom={} screen={} screenshotPx={} appWindowOnScreen={} webViewOnScreen={}\n".format(
                  n.get("idiom"), n.get("model"), n.get("screen"), n.get("window"), n.get("windowFrame"), n.get("webInWindow"), n.get("windowSafe"),
                  ru.get("idiom"), ru.get("screen"), ru.get("screenshotPx"), ru.get("appWindowOnScreen"), ru.get("webViewOnScreen")))
              print("| step | path | vv scale | native zoom | active | kbd | iw×ih | vv w×h | vv offL,offT | scrollW/clientW | dpr | safe t,r,b,l | contentOffset | contentSize | overflow | note |")
              print("|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|")
              for r in rows:
                  pg = r.get("page") if isinstance(r.get("page"), dict) else {}
                  na = r.get("native", {}); vv = pg.get("vv") or {}
                  print("| {} | {} | {} | {} | {} | {} | {}×{} | {}×{} | {},{} | {}/{} | {} | {} | {} | {} | {} | {} |".format(
                      r.get("step"), pg.get("path"), vv.get("s"), na.get("zoomScale"), pg.get("active"), (r.get("runner") or {}).get("keyboardShown"),
                      pg.get("iw"), pg.get("ih"), vv.get("w"), vv.get("h"), vv.get("ol"), vv.get("ot"), pg.get("sw"), pg.get("cw"),
                      pg.get("dpr"), pg.get("safe"), na.get("contentOffset"), na.get("contentSize"), len(pg.get("over") or []), r.get("note", "")))
              fields = next((r["page"].get("fields") for r in rows if isinstance(r.get("page"), dict)), None)
              print(f"\nfield font sizes: {fields}")
          json.dump(allrows, open(os.path.join(out, "measurements.json"), "w"), indent=1, ensure_ascii=False)
          PY

      - name: Keep the renders and readings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipad-zoom-xcuitest-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 30
