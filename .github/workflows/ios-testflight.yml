name: ios-testflight

# Archives, signs and uploads the iOS shell to TestFlight, internal testing
# only (docs/store/STORE_PATH.md T4). Copied from Scan & Action's measured
# pipeline (§8.4) and reduced to what this app needs: the shell loads the hosted
# site, so there is no web bundle to build and no npm anywhere in this file.
#
# ONE JOB, NO NPM, THE COMMIT ITSELF. The App Store Connect key lives in the
# GitHub environment `testflight`, which deploys from `main` alone; this
# workflow never runs on pull_request, so no fork and no pull request can reach
# the key. The job checks the commit out with git alone (no repository script,
# no package hook), proves that every tracked file under ios/ is what the
# commit says before the key exists (§8.5: Scan & Action archived an artifact
# built by the job that ran npm and did not check its project.pbxproj; here
# there is no artifact and nothing but the commit), resolves Swift packages
# from the committed Package.resolved and scans the graph for build plugins
# and macros, the only package code SwiftPM runs at build time, all BEFORE
# the key is written. The archive then runs with every fetch forbidden.
#
# SIGNING. API-key automatic signing: xcodebuild "will create and update
# profiles, app IDs, and certificates" (-allowProvisioningUpdates) with the
# key passed as -authenticationKey*. The archive signs for development (the
# owner's iPhone is a registered device on the team) and the export re-signs
# for the App Store with the cloud-managed Apple Distribution certificate. No
# certificate or profile is ever a secret. THE KEY'S ROLE IS ADMIN: Scan &
# Action measured an App Manager key failing the export with "Cloud signing
# permission error" (run 37616885844) and the Admin key passing end to end
# (run 37620796106); the owner approved the role on 2026-10-08. The key is on
# this one runner for the sweep, the archive and the export, and is removed
# in the last step even when a step fails.
#
# BUILD NUMBER, AND WHY IT CANNOT COLLIDE. CFBundleVersion = this workflow's
# run number, monotonic for the life of this file; CFBundleShortVersionString
# = MARKETING_VERSION in the Xcode project (1.0), changed only by a pull
# request. Two guards make a collision impossible rather than unlikely: before
# the archive, with the key already here, the job asks App Store Connect for
# the highest build number the app holds and refuses to archive unless the run
# number is above it (a renamed workflow file restarts run numbers at 1, which
# is the collision Scan & Action's scheme would not catch); and
# ExportOptions.plist sets manageAppVersionAndBuildNumber, so Xcode bumps a
# stale number in the staged copy at upload as the net behind the guard.
#
# CERTIFICATES. A hosted runner keeps no private key, so automatic signing
# creates a new Development certificate on every run, and Apple caps a team at
# ten (Scan & Action's run 13 hit the cap). The sweep below revokes the
# API-made Development certificates older than six hours and nothing else.
#
# TRIGGERS. A push to main that touches the native project or this file, and a
# manual run. NEVER pull_request. A docs-only merge does not run it (paths).
#
# ACTIONS are pinned to full commit SHAs, the release as a comment.
#
# COST. Standard macos-26 runner, free on this public repository
# (ios-smoke.yml). Apple requires uploads built with Xcode 26 or later.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'native/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: iOS — archive, sign, upload to TestFlight (no npm; the key on this runner only)
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60
    steps:
      # The commit itself, by git alone. The token it would otherwise leave in
      # .git/config is not persisted.
      - name: Check out the commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The `runner` context is not available in a job-level `env`; the key
      # directory is exported from a step (Scan & Action, first push of its file).
      - name: Key directory for this job only
        run: echo "APP_STORE_CONNECT_KEY_DIR=$RUNNER_TEMP/asc" >> "$GITHUB_ENV"

      # §8.5: the project Xcode will read is the commit, proven, not assumed.
      # No node_modules, no artifact, no generated file that differs from what
      # is committed; every tracked file under ios/ byte-identical to HEAD.
      - name: The project is the commit (no npm, no artifact, nothing untracked that Xcode reads)
        run: |
          set -eu
          test ! -e node_modules
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/public/index.html
          test -f ios/App/App/public/offline.html
          test -f ios/App/App/capacitor.config.json
          test -f ios/App/CapApp-SPM/Package.swift
          test -f ios/ExportOptions.plist
          # ITMS-91053: the app's own privacy manifest is in the commit and in
          # the target's Resources phase, so the archive carries it.
          test -f ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'PrivacyInfo.xcprivacy in Resources' ios/App/App.xcodeproj/project.pbxproj || { echo "FAIL: PrivacyInfo.xcprivacy is not in the app target's resources"; exit 1; }
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
          changed=$(git status --porcelain --untracked-files=all ios native capacitor.config.ts | wc -l | tr -d ' ')
          test "$changed" -eq 0 || { echo "FAIL: the iOS tree is not the commit:"; git status --porcelain --untracked-files=all ios native capacitor.config.ts; exit 1; }
          # The committed project must not carry a Run Script build phase at all
          # (the shell has none; one appearing is the §8.5 attack in the commit).
          if grep -q 'PBXShellScriptBuildPhase' ios/App/App.xcodeproj/project.pbxproj; then echo "FAIL: project.pbxproj carries a shell-script build phase"; exit 1; fi
          # The bundle Xcode copies verbatim holds only inert files.
          bad=$(find ios/App/App/public -type f ! \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.svg' -o -name '*.png' -o -name '*.ico' -o -name '*.txt' -o -name '*.woff' -o -name '*.woff2' \) | head)
          test -z "$bad" || { echo "FAIL: unexpected file types in the bundled public folder:"; echo "$bad"; exit 1; }
          echo "project: the commit $(git rev-parse HEAD); bundle id $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ios/App/App/Info.plist 2>/dev/null || grep -m1 PRODUCT_BUNDLE_IDENTIFIER ios/App/App.xcodeproj/project.pbxproj)"

      # The one native plugin (the study reminder's) is a local Swift package
      # under node_modules/, which this job never creates with npm: the
      # tarball is fetched from the registry and refused unless its sha512 is
      # the one package-lock.json pins; nothing in it is run.
      - name: The native plugins, by their package-lock.json sha512 (no npm)
        run: python3 .github/scripts/fetch-native-plugins.py

      - name: Xcode in use
        run: |
          sudo xcode-select -p
          xcodebuild -version

      # Network fetches and manifest evaluation happen here, with no key on the
      # runner. The committed Package.resolved pins every revision.
      - name: Resolve Swift packages (no key on this runner yet)
        run: |
          set -eu -o pipefail
          resolved=ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          test -f "$resolved" || { echo "no committed Package.resolved"; exit 1; }
          cp "$resolved" "$RUNNER_TEMP/Package.resolved.committed"
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$RUNNER_TEMP/resolve.log" | { grep -E '^(warning|error|\*\*|Resolved|Fetching|Cloning|Creating)|: (error|warning):' || true; }
          cmp "$RUNNER_TEMP/Package.resolved.committed" "$resolved" || { echo "the resolution rewrote the committed Package.resolved"; exit 1; }
          echo "resolved packages:"; ls "$RUNNER_TEMP/spm/checkouts"

      # Still no key. Build tool plugins and macros are the only package code
      # SwiftPM runs at build time; a dependency that adds one stops here.
      - name: No package in the graph declares a plugin or a macro
        run: |
          set -eu
          found=$(grep -lE '\.plugin\(|plugins:|\.macro\(' "$RUNNER_TEMP"/spm/checkouts/*/Package.swift ios/App/CapApp-SPM/Package.swift node_modules/@capacitor/*/Package.swift 2>/dev/null || true)
          test -z "$found" || { echo "packages declaring a plugin or a macro:"; echo "$found"; exit 1; }
          echo "manifests scanned: $(ls "$RUNNER_TEMP"/spm/checkouts/*/Package.swift ios/App/CapApp-SPM/Package.swift node_modules/@capacitor/*/Package.swift 2>/dev/null | wc -l | tr -d ' ')"

      # The key file exists only for this job, readable by the runner user
      # alone, removed in the last step. Its contents are never printed.
      - name: Place the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -eu
          umask 077
          test -n "$ASC_KEY_ID" || { echo "ASC_KEY_ID is empty"; exit 1; }
          mkdir -p "$APP_STORE_CONNECT_KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$APP_STORE_CONNECT_KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          test -s "$APP_STORE_CONNECT_KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          # A PEM header: five dashes, BEGIN, a type, KEY, five dashes.
          head -n 1 "$APP_STORE_CONNECT_KEY_DIR/AuthKey_$ASC_KEY_ID.p8" | grep -qE -- '^-----BEGIN [A-Z ]*KEY-----$' || { echo "ASC_KEY_P8 does not look like a PEM key file"; exit 1; }

      # Two readings through the API with the key already here: the build
      # number guard (header) and the certificate sweep (header). python3 and
      # openssl from the image, curl to api.appstoreconnect.apple.com alone;
      # the token is never printed. A failed sweep warns; a failed guard fails.
      - name: Build-number guard and the stale-certificate sweep (Admin key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_APPLE_ID: ${{ vars.ASC_APP_APPLE_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -u
          umask 077
          token=$(python3 - "$APP_STORE_CONNECT_KEY_DIR/AuthKey_$ASC_KEY_ID.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'PY'
          import base64, json, subprocess, sys, time
          key, kid, iss = sys.argv[1:4]
          b64 = lambda o: base64.urlsafe_b64encode(json.dumps(o, separators=(",", ":")).encode()).rstrip(b"=").decode()
          now = int(time.time())
          head = b64({"alg": "ES256", "kid": kid, "typ": "JWT"})
          body = b64({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"})
          der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", key], input=f"{head}.{body}".encode(), capture_output=True, check=True).stdout
          assert der[0] == 0x30
          pos = 2
          def integer():
              global pos
              assert der[pos] == 0x02
              length = der[pos + 1]
              value = der[pos + 2:pos + 2 + length]
              pos += 2 + length
              return int.from_bytes(value, "big")
          r, s = integer(), integer()
          sig = base64.urlsafe_b64encode(r.to_bytes(32, "big") + s.to_bytes(32, "big")).rstrip(b"=").decode()
          print(f"{head}.{body}.{sig}")
          PY
          ) || { echo "FAIL: could not mint an App Store Connect token"; exit 1; }
          api() { curl -g -sS -o "$RUNNER_TEMP/asc-body.json" -w '%{http_code}' -X "$1" -H "Authorization: Bearer $token" "https://api.appstoreconnect.apple.com$2"; }
          # --- the build-number guard ---
          test -n "$ASC_APP_APPLE_ID" || { echo "FAIL: the ASC_APP_APPLE_ID variable is empty"; exit 1; }
          code=$(api GET "/v1/builds?filter[app]=$ASC_APP_APPLE_ID&sort=-uploadedDate&limit=200&fields[builds]=version,uploadedDate,processingState") || code=000
          [ "$code" = 200 ] || { echo "FAIL: GET /v1/builds returned $code; the build-number guard cannot read the app"; exit 1; }
          highest=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1]))["data"]; v=[int(b["attributes"]["version"]) for b in d if str(b["attributes"].get("version","")).isdigit()]; print(max(v) if v else 0)' "$RUNNER_TEMP/asc-body.json")
          echo "builds App Store Connect holds for app $ASC_APP_APPLE_ID: $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["data"]))' "$RUNNER_TEMP/asc-body.json"); highest build number: $highest; this run: $RUN_NUMBER"
          [ "$RUN_NUMBER" -gt "$highest" ] || { echo "FAIL: build number $RUN_NUMBER would not be above the highest build already uploaded ($highest); run numbers restarted (a renamed workflow?) — bump the scheme, do not upload"; exit 1; }
          # --- the certificate sweep ---
          code=$(api GET '/v1/certificates?limit=200&fields[certificates]=certificateType,displayName,expirationDate') || code=000
          [ "$code" = 200 ] || { echo "::warning::GET /v1/certificates returned $code; the sweep is skipped"; rm -f "$RUNNER_TEMP/asc-body.json"; exit 0; }
          python3 - "$RUNNER_TEMP/asc-body.json" > "$RUNNER_TEMP/stale-certs.txt" <<'PY' || { echo "::warning::could not read the certificate list; the sweep is skipped"; rm -f "$RUNNER_TEMP/asc-body.json"; exit 0; }
          import datetime as dt, json, sys
          now = dt.datetime.now(dt.timezone.utc)
          total = stale = young = 0
          for cert in json.load(open(sys.argv[1]))["data"]:
              a = cert["attributes"]
              total += 1
              if a["certificateType"] != "DEVELOPMENT" or a["displayName"] != "Created via API":
                  continue
              created = dt.datetime.fromisoformat(a["expirationDate"].replace("Z", "+00:00")) - dt.timedelta(days=365)
              if now - created > dt.timedelta(hours=6):
                  stale += 1
                  print(cert["id"])
              else:
                  young += 1
          print(f"certificates on the team: {total}; API-made Development: stale {stale}, younger than 6 h {young}", file=sys.stderr)
          PY
          revoked=0
          while read -r id; do
            [ -n "$id" ] || continue
            code=$(api DELETE "/v1/certificates/$id") || code=000
            if [ "$code" = 204 ]; then revoked=$((revoked + 1)); else echo "::warning::DELETE /v1/certificates/$id returned $code"; fi
          done < "$RUNNER_TEMP/stale-certs.txt"
          echo "stale API-made Development certificates revoked: $revoked"
          rm -f "$RUNNER_TEMP/asc-body.json" "$RUNNER_TEMP/stale-certs.txt"

      # pipefail: the step fails on xcodebuild's own status; the filter only
      # chooses which lines reach the log. The package flags forbid any fetch
      # or re-resolution now that the key exists.
      - name: Archive (automatic signing with the API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -eu -o pipefail
          test -n "$APPLE_TEAM_ID" || { echo "the APPLE_TEAM_ID variable is empty"; exit 1; }
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_DIR/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | { grep -E '^(warning|error|\*\*|Archive)|: (error|warning):' || true; }
          test -d "$RUNNER_TEMP/App.xcarchive" || { echo "no archive was produced"; tail -n 80 "$RUNNER_TEMP/archive.log"; exit 1; }
          app="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -f "$app/App" || { echo "no App binary in the archive"; exit 1; }
          echo "archived: bundle $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist") version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist") build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist") encryption-exempt $(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "com.knowflow.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "${{ github.run_number }}"
          # ITMS-90683's lesson: no purpose string for a permission the app does not use.
          if /usr/libexec/PlistBuddy -c 'Print' "$app/Info.plist" | grep -q 'UsageDescription'; then echo "FAIL: a purpose string is in Info.plist but no permission is used"; exit 1; fi
          echo "linked frameworks (otool -L):"; otool -L "$app/App" | tee "$RUNNER_TEMP/otool.txt"
          grep -q "UIKit.framework" "$RUNNER_TEMP/otool.txt" || { echo "otool -L named no UIKit: the reading is empty, not clean"; exit 1; }
          # ITMS-91053, before the upload rather than in Apple's e-mail after it.
          python3 .github/scripts/ios-privacy-check.py "$app" | tee "$RUNNER_TEMP/privacy-audit.txt"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_DIR/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | { grep -E -i '^(warning|error|\*\*|Upload|Export)|: (error|warning):' || true; }
          grep -q -i 'EXPORT SUCCEEDED\|Upload succeeded' "$RUNNER_TEMP/export.log" || { echo "export/upload did not report success"; tail -n 80 "$RUNNER_TEMP/export.log"; exit 1; }
          echo "Uploaded build ${{ github.run_number }} of com.knowflow.app for commit ${{ github.sha }}"

      - name: Remove the key
        if: always()
        run: rm -rf "$APP_STORE_CONNECT_KEY_DIR"

      - name: Keep the logs (no secret in them)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-testflight-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/resolve.log
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/otool.txt
            ${{ runner.temp }}/privacy-audit.txt
          if-no-files-found: warn
          retention-days: 14
