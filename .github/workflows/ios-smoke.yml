name: ios-smoke

# DIAGNOSTIC — branch diag/ipad-zoom ONLY; never merged. This file replaces the
# smoke job on the branch so it can be dispatched with --ref (a workflow must
# exist on main to be dispatchable at all).
#
# Purpose (owner, 2026-10-24, Guideline 4.0 rejection of 1.0 build 7): prove or
# disprove that tapping a 14 px field zooms the web view and that the zoom
# survives client-side navigation, on an iPad Air 11-inch (M3) simulator
# running the iPhone-only app in compatibility mode, plus an iPhone baseline.
#
# Signed out only: no environment, no secret, no account, no sign-in, no AI
# call. The taps are real touches through idb (idb_companion + fb-idb), never
# JavaScript focus(). Every line of smoke.jsonl carries the page measurement
# (when the step is one) and the native geometry (MainViewController.swift).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipad-zoom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zoom:
    name: iOS — focus-zoom measurement, iPhone baseline and iPad compatibility mode (signed out)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync the native projects
        run: npx cap sync

      - name: Xcode in use
        run: |
          sudo xcode-select -p
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          set -eu -o pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -onlyUsePackageVersionsFromResolvedFile 2>&1 \
            | tee "$RUNNER_TEMP/resolve.log" | { grep -E '^(warning|error|\*\*)|: (error|warning):' || true; }

      - name: Build for the iOS Simulator (unsigned)
        run: |
          set -eu -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -E '^(error|\*\*|Build)|: error:' || true; }
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -n "$app" || { echo "no App.app was built"; tail -n 60 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "UIDeviceFamily of the built app (1 = iPhone only):"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$app/Info.plist"

      # The tap tool. If it cannot be installed the job stops here (owner's rule:
      # report and stop, no re-run).
      - name: Install idb (idb_companion + fb-idb)
        run: |
          set -eu
          brew tap facebook/fb
          brew install idb-companion uv
          uv tool install --python 3.11 fb-idb
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          idb_companion --version || true
          "$HOME/.local/bin/idb" --help | head -n 5

      - name: Measure on the iPhone baseline and on the iPad Air 11-inch (M3)
        run: |
          set -u
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          # The steps: every m-* step returns the page measurement as its result.
          python3 - "$RUNNER_TEMP/steps.json" <<'PY'
          import json, sys
          MEASURE = r"""(function(){var d=document.documentElement,v=window.visualViewport,p=document.createElement('div');p.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';document.body.appendChild(p);var cs=getComputedStyle(p),safe=[cs.paddingTop,cs.paddingRight,cs.paddingBottom,cs.paddingLeft].map(parseFloat);p.remove();var W=d.clientWidth,o=[],all=document.body.getElementsByTagName('*');for(var i=0;i<all.length&&o.length<12;i++){var el=all[i],r=el.getBoundingClientRect();if(r.width>0&&(r.right>W+0.5||r.left<-0.5)){o.push(el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+(typeof el.className==='string'&&el.className.trim()?'.'+el.className.trim().split(/\s+/).slice(0,3).join('.'):'')+' w='+Math.round(r.width)+' l='+Math.round(r.left)+' r='+Math.round(r.right))}}var a=document.activeElement,f=Array.prototype.slice.call(document.querySelectorAll('input,textarea,select')).map(function(x){return (x.type||x.tagName.toLowerCase())+':'+getComputedStyle(x).fontSize});return JSON.stringify({path:location.pathname+location.search,iw:innerWidth,ih:innerHeight,vv:v?{w:v.width,h:v.height,s:v.scale,ol:v.offsetLeft,ot:v.offsetTop,pl:v.pageLeft,pt:v.pageTop}:null,sw:d.scrollWidth,cw:W,sh:d.scrollHeight,ch:d.clientHeight,sx:scrollX,sy:scrollY,dpr:devicePixelRatio,safe:safe,dir:d.dir,theme:d.getAttribute('data-theme'),active:a?(a.tagName+(a.type?':'+a.type:'')):null,fields:f,over:o,nav:window.__kfNav||0})})()"""
          NAV = "(function(){window.__kfNav=1;var a=Array.prototype.slice.call(document.querySelectorAll('a')).filter(function(a){return /\\/signup$/.test(a.getAttribute('href')||'')})[0];if(!a){return 'no signup link'}a.click();return 'clicked '+a.getAttribute('href')})()"
          def load(q): return "(function(){location.assign('/ar/login?d=%s');return 'assigned'})()" % q
          steps = [
            {"name": "ar-login", "until": r"/ar/login\?d=1$", "wait": 3000, "js": load(1)},
            {"name": "m-before-email", "wait": 300, "js": MEASURE},
            {"name": "m-after-email-tap", "wait": 300, "js": MEASURE},
            {"name": "nav-signup-1", "until": r"/ar/signup$", "wait": 2500, "js": NAV},
            {"name": "m-after-email-nav", "wait": 300, "js": MEASURE},
            {"name": "ar-login-fresh", "until": r"/ar/login\?d=2$", "wait": 3000, "js": load(2)},
            {"name": "m-before-password", "wait": 300, "js": MEASURE},
            {"name": "m-after-password-tap", "wait": 300, "js": MEASURE},
            {"name": "nav-signup-2", "until": r"/ar/signup$", "wait": 2500, "js": NAV},
            {"name": "m-after-password-nav", "wait": 300, "js": MEASURE},
          ]
          json.dump(steps, open(sys.argv[1], "w"))
          PY
          steps=$(base64 < "$RUNNER_TEMP/steps.json" | tr -d '\n')

          rt=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("platform")=="iOS" and x.get("isAvailable")]; r.sort(key=lambda x:[int(p) for p in x["version"].split(".")]); print(r[-1]["identifier"])')
          dt_ipad=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=[x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"]=="iPad Air 11-inch (M3)"]; print(d[0] if d else "")')
          dt_iphone=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=sorted((x["name"],x["deviceTypeIdentifier"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")); print(c[-1][1])')
          echo "runtime: $rt"; echo "iPhone type: $dt_iphone"; echo "iPad type: ${dt_ipad:-MISSING}"
          echo "$rt $dt_iphone $dt_ipad" > "$OUT/devices.txt"

          tapfield() {
            dev=$1; kind=$2
            idb ui describe-all --json > "$OUT/$dev-ax-$kind.json" 2> "$OUT/$dev-ax-$kind.err" || echo "describe-all failed: $(head -c 400 "$OUT/$dev-ax-$kind.err")"
            pt=$(python3 - "$OUT/$dev-ax-$kind.json" "$kind" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read().strip()
          try:
              els = json.loads(raw)
          except Exception:
              els = [json.loads(l) for l in raw.splitlines() if l.strip().startswith("{")]
          if isinstance(els, dict): els = [els]
          want = ("SecureTextField",) if sys.argv[2] == "password" else ("TextField",)
          for e in els:
              t = e.get("type") or ""
              role = e.get("role") or ""
              if t in want or role == "AX" + want[0]:
                  f = e.get("frame") or {}
                  if f.get("width", 0) > 0:
                      print("%.1f %.1f %s" % (f["x"] + f["width"] / 2, f["y"] + f["height"] / 2, json.dumps({"type": t, "label": e.get("AXLabel"), "frame": f}, ensure_ascii=False)))
                      break
          PY
          )
            if [ -z "$pt" ]; then echo "TAP FAILED ($dev $kind): no field in the accessibility tree"; echo "$dev $kind none" >> "$OUT/taps.txt"; return; fi
            x=$(echo "$pt" | cut -d' ' -f1); y=$(echo "$pt" | cut -d' ' -f2)
            if idb ui tap "$x" "$y" 2> "$OUT/$dev-tap-$kind.err"; then echo "tapped $dev $kind at $pt"; echo "$dev $kind $pt" >> "$OUT/taps.txt"
            else echo "TAP FAILED ($dev $kind): $(head -c 400 "$OUT/$dev-tap-$kind.err")"; echo "$dev $kind failed" >> "$OUT/taps.txt"; fi
            sleep 3
          }

          run_device() {
            dev=$1; dtype=$2
            [ -n "$dtype" ] || { echo "SKIP $dev: device type not on this image"; return; }
            UDID=$(xcrun simctl create "kf-$dev" "$dtype" "$rt") || { echo "SKIP $dev: create failed"; return; }
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b | tail -n 1
            xcrun simctl ui "$UDID" appearance dark || true
            if ! xcrun simctl install "$UDID" "$APP_PATH" 2> "$OUT/$dev-install.err"; then echo "INSTALL FAILED on $dev: $(cat "$OUT/$dev-install.err")"; xcrun simctl shutdown "$UDID"; return; fi
            idb_companion --udid "$UDID" --grpc-port 10882 > "$OUT/$dev-companion.log" 2>&1 &
            cpid=$!
            for i in $(seq 1 30); do nc -z localhost 10882 2>/dev/null && break; sleep 1; done
            idb connect localhost 10882 || echo "idb connect failed on $dev"
            idb list-targets > "$OUT/$dev-targets.txt" 2>&1 || true
            data=$(xcrun simctl get_app_container "$UDID" com.knowflow.app data)
            sf() { find "$data/tmp" -maxdepth 3 -name "$1" 2>/dev/null | head -n 1; }
            SIMCTL_CHILD_KF_SMOKE=1 SIMCTL_CHILD_KF_SMOKE_STEPS="$steps" xcrun simctl launch "$UDID" com.knowflow.app --kf-smoke "--kf-steps=$steps" &
            seen=0
            for i in $(seq 1 600); do
              f=$(sf smoke.jsonl); n=0; [ -n "$f" ] && n=$(wc -l < "$f" | tr -d ' ')
              if [ "$n" -gt "$seen" ]; then
                seen=$n
                name=$(tail -n 1 "$f" | python3 -c 'import json,sys; print(json.loads(sys.stdin.readline())["step"])')
                xcrun simctl io "$UDID" screenshot "$OUT/$dev-$(printf %02d "$seen")-$name.png" >/dev/null 2>&1 || true
                echo "$dev line $seen ($name)"
                case "$name" in
                  m-before-email) tapfield "$dev" email ;;
                  m-before-password) tapfield "$dev" password ;;
                esac
                touch "$(dirname "$f")/ack-$seen"
              fi
              [ -n "$(sf smoke.done)" ] && break
              sleep 1
            done
            f=$(sf smoke.jsonl); [ -n "$f" ] && cp "$f" "$OUT/$dev.jsonl"
            [ -n "$(sf smoke.done)" ] || echo "WARN $dev: the run did not finish; lines seen $seen"
            xcrun simctl terminate "$UDID" com.knowflow.app || true
            idb disconnect localhost 10882 || true
            kill "$cpid" 2>/dev/null || true
            xcrun simctl shutdown "$UDID" || true
          }

          run_device iphone "$dt_iphone"
          run_device ipad "$dt_ipad"
          ls -1 "$OUT"

      - name: The measurement table
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          python3 - "$OUT" <<'PY' | tee "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          out = sys.argv[1]
          for dev in ("iphone", "ipad"):
              p = os.path.join(out, dev + ".jsonl")
              print(f"\n## {dev}\n")
              if not os.path.exists(p):
                  print("no readings"); continue
              rows = [json.loads(l) for l in open(p) if l.strip()]
              n0 = rows[0].get("native", {})
              print("first reading (native): " + json.dumps({k: n0.get(k) for k in ("idiom", "traitIdiom", "model", "screen", "screenNative", "screenScale", "sceneScreen", "window", "windowFrame", "webFrame", "webInWindow", "windowSafe", "viewSafe")}))
              print("\n| step | path | iw×ih | vv w×h | vv scale | vv offL,offT | scrollW/clientW | dpr | safe t,r,b,l | active | native zoom | offset | contentSize | adjInset | overflow |")
              print("|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|")
              for r in rows:
                  nat = r.get("native", {})
                  m = {}
                  if r["step"].startswith("m-"):
                      try: m = json.loads(r.get("result", "{}"))
                      except Exception: m = {"raw": r.get("result", "")[:80]}
                  vv = m.get("vv") or {}
                  print("| {} | {} | {} | {} | {} | {} | {} | {} | {} | {} | {} | {} | {} | {} | {} |".format(
                      r["step"], m.get("path", (r.get("probe") or {}).get("href", "")), f"{m.get('iw')}×{m.get('ih')}" if m else "",
                      f"{vv.get('w')}×{vv.get('h')}" if vv else "", vv.get("s", ""), f"{vv.get('ol')},{vv.get('ot')}" if vv else "",
                      f"{m.get('sw')}/{m.get('cw')}" if m else "", m.get("dpr", ""), m.get("safe", ""), m.get("active", ""),
                      nat.get("zoomScale"), nat.get("contentOffset"), nat.get("contentSize"), nat.get("adjustedInset"),
                      "; ".join(m.get("over") or []) if m else ""))
              fields = None
              for r in rows:
                  if r["step"] == "m-before-email":
                      try: fields = json.loads(r["result"]).get("fields")
                      except Exception: pass
              print(f"\nfield font sizes on /ar/login: {fields}")
          taps = os.path.join(out, "taps.txt")
          print("\n## taps\n\n" + (open(taps).read() if os.path.exists(taps) else "none recorded"))
          PY

      - name: Keep the renders and readings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipad-zoom-diag-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 30
