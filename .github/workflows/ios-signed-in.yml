name: ios-signed-in

# The signed-in screens of the iOS shell, proven in the Simulator against the
# live site with the dedicated reviewer account (docs/store/STORE_PATH.md S8,
# PROGRESS.md 2026-10-08): the dashboard, the subject and its material, the
# summary and the quiz, Ask, Settings, then (Step Wording-1) the privacy,
# (Step Redesign-2: the app has no top bar any more; the screenshot steps
# measure whatever fixed bar there is, zero now, instead of a fixed 90 px.)
# terms, refund, about and contact pages and, in Arabic, the home, Subjects,
# Ask, Settings to its last line and the same five pages. On every one of
# those screens the probe in MainViewController.swift takes the Apple 3.1.3(f)
# reading: no plan, subscription, upgrade, premium or Pro tier, price,
# checkout or free word (scripts/lib/app-wording.mjs, Arabic by stem) and no
# purchase link anywhere in the page, below the fold included. A hit fails
# the run. The run ends back on the English dashboard. The first quiz meets the AI permission sheet of Apple
# 5.1.2(i) (src/lib/ai-consent.ts): the run checks that it names Anthropic and
# Voyage AI, accepts it, and withdraws it again in Settings at the end, so the
# reviewer account is left without the permission and App Review meets the
# sheet too. A run that stops between the two leaves it given; the next run
# then fails the sheet reading but still withdraws it at its end, and the one
# after is green.
#
# SECRETS, AND WHERE THEY CAN BE READ. The reviewer account's e-mail and
# password are the two secrets of the GitHub environment `reviewer`, which
# deploys from `main` alone (gh api repos/{owner}/{repo}/environments/reviewer:
# custom branch policy, `main`). This workflow never runs on pull_request, so
# a fork and a pull request have no path to the environment at all. The job
# runs no npm, no setup-node and no package script: the credentials sit on a
# runner that executes xcodebuild over the committed tree and nothing else
# (the drift check between capacitor.config.ts and the committed ios/ is
# ios-smoke.yml's job, on every pull request, with no secrets). The
# credentials reach the app only as launch-environment variables and are
# never part of the steps JSON (whose first bytes land in smoke.boot); the app
# scrubs every recorded line of them.
#
# Step Store-Shots-1: the App Store capture (scenario screenshots, dispatch
# only) runs in the environment `screenshots` instead (main only, like
# `reviewer`): the e-mail and password of the two screenshot accounts,
# +kfshots-ar and +kfshots-en, which store-seed.yml fills. That scenario never
# reads the reviewer's secrets, and every other scenario never reads these.
#
# WHAT A LEAK WOULD COST. The account is free, seeded with one subject and one
# material, and is the one App Review will use; nothing else is reachable with
# it. Its password is rotated with one `gh secret set` and one sign-in.
#
# COST. Standard macos-26 runner, free on this public repository (ios-smoke.yml).

# STEP CI-COST-1: THE RUN STARTS WHEN THE SITE IS LIVE, ONCE. Every
# push-triggered run in Oct 1-12 started within seconds of the merge and read
# the site before Vercel had finished deploying it (about a minute, once
# forty), so five were re-dispatched by hand after the deploy (65 macOS
# minutes) and six failed on the old copy. Vercel's GitHub integration posts
# a Deployment status for every production build, so that is the trigger:
# `deployment_status`, environment Production, state success. That event's
# ref is the deployed commit's sha, which the `reviewer` environment (main
# only) would refuse, so the event runs a RELAY job instead: Linux, seconds,
# no environment and no secret, which reads what the deployed commit changed
# and, if it touched the shell, the app's code or this workflow, dispatches
# this same workflow on main with the repository's own token (a
# workflow_dispatch made with GITHUB_TOKEN is the documented exception to
# "no chaining"). The signed-in job runs on that dispatch, after the deploy,
# once per merge that matters, and never on a docs-only merge.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: 'the deployed commit the relay saw (informational)'
        type: string
        required: false
        default: ''
      scenario:
        description: 'screens: the signed-in screens (as on every push). background-upload: the measurement of an upload sent to the background. screenshots: the App Store set, 6.9-inch, en and ar (dispatch only)'
        type: choice
        options: [screens, background-upload, screenshots, frame]
        default: screens
      source_run:
        description: 'frame only: the id of an earlier screenshots run on main whose capture is framed again (Linux, no macOS, no AI call)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Never cancelled mid-way: a cancelled run can leave the reviewer account
# with the AI permission given. A second run queues behind the first.
concurrency:
  group: ios-signed-in-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relay:
    name: After the production deploy, dispatch the signed-in run if the app changed
    if: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      deployments: read
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 1
      # Step CI-Relay-Fix. The base is the commit of the PREVIOUS Production
      # deployment, not HEAD~1: a rebase merge of several commits, or two
      # merges Vercel deploys as one, changed more than the last commit.
      # --no-renames lists both sides of a move. The site is built from more
      # than src/ (the dependencies, next/tailwind/postcss config, vercel.json),
      # and the job runs fetch-native-plugins.py. Fail closed: if the previous
      # deployment or the diff cannot be read, the run is dispatched.
      - name: Decide, and dispatch on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
        run: |
          set -eu
          prev=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=30" --jq "[.[] | select(.id < $DEPLOYMENT_ID)][0].sha // empty" || true)
          changed="(unknown)"
          if [ -n "$prev" ] && git fetch --no-tags --depth=1 origin "$prev"; then
            changed=$(git diff --name-only --no-renames "$prev" "$SHA") || changed="(unknown)"
          fi
          echo "deployed $SHA, previous Production ${prev:-(none read)}, changed:"; echo "$changed" | sed 's/^/  /'
          if [ "$changed" = "(unknown)" ] || echo "$changed" | grep -qE '^(ios/|native/|capacitor\.config\.ts|src/|package(-lock)?\.json$|next\.config\.ts$|tailwind\.config\.ts$|postcss\.config\.js$|vercel\.json$|\.github/scripts/fetch-native-plugins\.py$|\.github/workflows/ios-signed-in\.yml$)'; then
            gh workflow run ios-signed-in.yml --ref main -f scenario=screens -f "deployed_sha=$SHA"
            echo "dispatched the signed-in run on main for $SHA"
          else
            echo "nothing the signed-in run reads changed: no run"
          fi

  signed-in:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario != 'frame' }}
    name: iOS — simulator run of the signed-in screens with the reviewer account (no npm)
    runs-on: macos-26
    # Step Store-Shots-1: the App Store capture signs into the two screenshot
    # accounts (environment screenshots); every other scenario uses the reviewer.
    environment: ${{ inputs.scenario == 'screenshots' && 'screenshots' || 'reviewer' }}
    timeout-minutes: 45
    steps:
      # git alone: checkout runs no repository script and no package hook.
      - name: Check out the commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Start booting a simulator (overlaps the build)
        env:
          # The store set needs Apple's 6.9-inch size, 1320 x 2868: a Pro Max.
          PREFER: ${{ inputs.scenario == 'screenshots' && 'Pro Max' || '' }}
        run: |
          set -eu
          udid=$(xcrun simctl list devices available -j | PREFER="$PREFER" python3 -c 'import json,os,sys; p=os.environ.get("PREFER",""); d=json.load(sys.stdin)["devices"]; c=[(r,x["udid"],x["name"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone") and p in x["name"]]; c.sort(); print(c[-1][1])')
          test -n "$udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$udid" > "$RUNNER_TEMP/boot.log" 2>&1 &
          echo "boot of $udid started at $(date -u +%H:%M:%SZ)"

      - name: Nothing but the committed tree is on this runner
        run: |
          set -eu
          test ! -e node_modules
          test -f ios/App/App/public/index.html
          test -f ios/App/App/capacitor.config.json
          test "$(git status --porcelain --untracked-files=no ios native capacitor.config.ts | wc -l | tr -d ' ')" -eq 0 || { echo "a tracked file changed after checkout"; git status --porcelain ios; exit 1; }

      # The one native plugin (the study reminder's) is a local Swift package
      # under node_modules/, which this job never creates with npm: the
      # tarball is fetched from the registry and refused unless its sha512 is
      # the one package-lock.json pins; nothing in it is run.
      - name: The native plugins, by their package-lock.json sha512 (no npm)
        run: python3 .github/scripts/fetch-native-plugins.py

      - name: Xcode in use
        run: |
          sudo xcode-select -p
          xcodebuild -version

      - name: Resolve Swift packages from the committed Package.resolved
        run: |
          set -eu -o pipefail
          resolved=ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          test -f "$resolved" || { echo "no committed Package.resolved"; exit 1; }
          cp "$resolved" "$RUNNER_TEMP/Package.resolved.committed"
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee "$RUNNER_TEMP/resolve.log" | { grep -E '^(warning|error|\*\*|Resolved|Fetching|Cloning|Creating)|: (error|warning):' || true; }
          cmp "$RUNNER_TEMP/Package.resolved.committed" "$resolved" || { echo "FAIL: the resolution rewrote the committed Package.resolved"; exit 1; }

      - name: Build for the iOS Simulator (unsigned)
        run: |
          set -eu -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -E '^(warning|error|\*\*|Build)|: (error|warning):' || true; }
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -n "$app" || { echo "no App.app was built"; tail -n 60 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      # Step Store-Shots-1: the boot was STARTED right after checkout (the
      # step "Start booting a simulator"), so its minutes overlap the plugin
      # fetch, the package resolve and the build; this step only waits for it.
      # Runs 38386881311, 38397283151 and 38414568529 spent 91, 338 and 503 s
      # here on the same image, device and region: the wait is the runner's.
      - name: Boot a simulator
        env:
          PREFER: ${{ inputs.scenario == 'screenshots' && 'Pro Max' || '' }}
        run: |
          set -eu
          test -n "$UDID"
          echo "simulator: $(xcrun simctl list devices available | grep "$UDID")"
          start=$(date +%s)
          # Wait for the boot started after checkout to reach Booted (not `-b`,
          # which could try a second boot of a device still booting), then for
          # the services bootstatus waits on.
          for i in $(seq 1 450); do xcrun simctl list devices | grep "$UDID" | grep -q "(Booted)" && break; sleep 2; done
          xcrun simctl list devices | grep "$UDID" | grep -q "(Booted)" || { echo "the simulator did not boot"; cat "$RUNNER_TEMP/boot.log" || true; exit 1; }
          xcrun simctl bootstatus "$UDID" | tail -n 2
          echo "waited $(( $(date +%s) - start )) s here for the boot started after checkout"
          cat "$RUNNER_TEMP/boot.log" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/shots"
          if [ -n "$PREFER" ]; then
            # Apple's own status bar for marketing shots: 9:41, full bars, charged.
            xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --operatorName "" --batteryState charged --batteryLevel 100
          fi

      # The steps. The login step fills the twin's form through React's own
      # value setter and submits it; __KF_EMAIL__ and __KF_PASSWORD__ are bare
      # tokens here, replaced inside the app from the launch environment. Every
      # later step is a navigation or a scroll, each followed by the probe and a
      # screenshot. `l` is the locale the page is on.
      - name: Signed-in run against the live site
        if: ${{ inputs.scenario == 'screens' }}
        env:
          KF_SMOKE_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          KF_SMOKE_PASSWORD: ${{ secrets.REVIEWER_PASSWORD }}
        run: |
          set -eu
          test -n "$KF_SMOKE_EMAIL" || { echo "REVIEWER_EMAIL is empty"; exit 1; }
          test -n "$KF_SMOKE_PASSWORD" || { echo "REVIEWER_PASSWORD is empty"; exit 1; }
          cat > "$RUNNER_TEMP/steps.json" <<'JSON'
          [
            {"name":"google-hint","wait":500,"js":"(function(){var h=document.querySelector('[data-kf-google-hint]');if(!h){return 'no hint'}var a=h.querySelector('a');return (h.innerText||'').replace(/\\s+/g,' ').trim()+' | '+(a?a.getAttribute('href'):'no link')})()"},
            {"name":"login","until":"/(en|ar)/dashboard$","timeout":60000,"wait":3000,"js":"(function(){var set=function(el,v){var s=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;s.call(el,v);el.dispatchEvent(new Event('input',{bubbles:true}))};var e=document.querySelector('input[name=email]'),p=document.querySelector('input[name=password]');if(!e||!p){return 'no login form'}set(e,__KF_EMAIL__);set(p,__KF_PASSWORD__);var f=e.form;if(!f){return 'no form'}setTimeout(function(){if(f.requestSubmit){f.requestSubmit()}else{f.submit()}},100);return 'submitted'})()"},
            {"name":"home","wait":3000,"js":"(function(){window.scrollTo(0,0);return location.pathname})()"},
            {"name":"home-bottom","wait":1500,"js":"(function(){window.scrollTo(0,document.body.scrollHeight);return 'scrolled '+document.body.scrollHeight})()"},
            {"name":"subjects","until":"/dashboard/knowledge$","wait":8000,"js":"(function(){var a=document.querySelector('a[href$=\"/dashboard/knowledge\"]');if(!a){return 'no Subjects link'}a.click();return 'clicked Subjects'})()"},
            {"name":"subject","until":"/dashboard/knowledge/[0-9a-f-]{36}$","wait":10000,"js":"(function(){var a=Array.prototype.slice.call(document.querySelectorAll('a[href*=\"/dashboard/knowledge/\"]')).filter(function(a){return !/\\/new$/.test(a.getAttribute('href')||'')})[0];if(!a){return 'no subject link'}a.click();return 'clicked a subject'})()"},
            {"name":"summary","wait":2000,"js":"(function(){var h=Array.prototype.slice.call(document.querySelectorAll('h1,h2,h3,h4,p,span,div')).filter(function(x){return x.children.length===0&&/^(SUMMARY|Summary|الملخص|ملخص)$/.test((x.innerText||'').trim())})[0];if(!h){return 'no summary heading'}h.scrollIntoView({block:'start'});return 'scrolled to summary'})()"},
            {"name":"quiz-open","wait":4000,"js":"(function(){var b=Array.prototype.slice.call(document.querySelectorAll('button')).filter(function(x){return /Quiz me on this material|اختبرني في هذا الملف/.test(x.innerText||'')})[0];if(!b){return 'no quiz button'}b.click();return 'clicked quiz'})()"},
            {"name":"consent","wait":15000,"js":"(function(){var d=document.querySelector('[data-kf-consent-sheet=open]');if(!d){return 'no consent sheet'}var t=d.innerText||'';var names=['Anthropic','Voyage AI'].filter(function(n){return t.indexOf(n)>=0});var b=d.querySelector('[data-kf-consent=accept]');if(!b){return 'no accept button'}b.click();return 'accepted: '+names.join(', ')})()"},
            {"name":"quiz","wait":2000,"js":"(function(){var b=Array.prototype.slice.call(document.querySelectorAll('button')).filter(function(x){return /Check my answers|صحّح إجاباتي/.test(x.innerText||'')})[0];if(!b){return 'no quiz on screen'}b.scrollIntoView({block:'end'});return 'scrolled to quiz'})()"},
            {"name":"ask","until":"/dashboard/agent$","wait":8000,"js":"(function(){var a=document.querySelector('a[href$=\"/dashboard/agent\"]');if(!a){return 'no Ask link'}a.click();return 'clicked Ask'})()"},
            {"name":"settings","until":"/dashboard/settings$","wait":8000,"js":"(function(){var a=document.querySelector('a[href$=\"/dashboard/settings\"]');if(!a){return 'no Settings link'}a.click();return 'clicked Settings'})()"},
            {"name":"consent-on","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-consent-state]');if(!c){return 'no consent card'}c.scrollIntoView({block:'center'});return c.getAttribute('data-kf-consent-state')})()"},
            {"name":"consent-withdraw","wait":5000,"js":"(function(){var b=document.querySelector('[data-kf-consent=withdraw]');if(!b){return 'no withdraw button'}b.click();return 'clicked withdraw'})()"},
            {"name":"consent-off","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-consent-state]');if(!c){return 'no consent card'}return c.getAttribute('data-kf-consent-state')})()"},
            {"name":"reminder-card","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-reminder-state]');if(!c){return 'no reminder card'}var w=c.getAttribute('data-kf-reminder-why');if(w){return 'unavailable: '+w}c.scrollIntoView({block:'center'});return c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time')})()"},
            {"name":"reminder-on","wait":3000,"js":"(function(){var b=document.querySelector('[data-kf-reminder=toggle]');if(!b){return 'no toggle'}b.click();return 'clicked on'})()"},
            {"name":"reminder-read-on","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-reminder-state]');return c?c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time'):'no reminder card'})()"},
            {"name":"reminder-pending-on","until":"#kfP[0-9]+=","timeout":15000,"wait":300,"js":"(function(){var m=function(v){history.replaceState(history.state,'',location.pathname+location.search+'#kfP'+Date.now()+'='+encodeURIComponent(v))};window.Capacitor.nativePromise('LocalNotifications','getPending',{}).then(function(r){m(JSON.stringify(r.notifications.map(function(n){return {id:n.id,on:n.schedule&&n.schedule.on}})))},function(e){m('error '+e.message)});return 'asked'})()"},
            {"name":"reminder-time","wait":3000,"js":"(function(){var i=document.querySelector('[data-kf-reminder=time]');if(!i){return 'no time input'}var s=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;s.call(i,'07:30');i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));return 'set 07:30'})()"},
            {"name":"reminder-read-time","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-reminder-state]');return c?c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time'):'no reminder card'})()"},
            {"name":"reminder-pending-time","until":"#kfP[0-9]+=","timeout":15000,"wait":300,"js":"(function(){var m=function(v){history.replaceState(history.state,'',location.pathname+location.search+'#kfP'+Date.now()+'='+encodeURIComponent(v))};window.Capacitor.nativePromise('LocalNotifications','getPending',{}).then(function(r){m(JSON.stringify(r.notifications.map(function(n){return {id:n.id,on:n.schedule&&n.schedule.on}})))},function(e){m('error '+e.message)});return 'asked'})()"},
            {"name":"reminder-off","wait":3000,"js":"(function(){var b=document.querySelector('[data-kf-reminder=toggle]');if(!b){return 'no toggle'}b.click();return 'clicked off'})()"},
            {"name":"reminder-read-off","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-reminder-state]');return c?c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time'):'no reminder card'})()"},
            {"name":"reminder-pending-off","until":"#kfP[0-9]+=","timeout":15000,"wait":300,"js":"(function(){var m=function(v){history.replaceState(history.state,'',location.pathname+location.search+'#kfP'+Date.now()+'='+encodeURIComponent(v))};window.Capacitor.nativePromise('LocalNotifications','getPending',{}).then(function(r){m(JSON.stringify(r.notifications.map(function(n){return {id:n.id,on:n.schedule&&n.schedule.on}})))},function(e){m('error '+e.message)});return 'asked'})()"},
            {"name":"settings-bottom","wait":1500,"js":"(function(){window.scrollTo(0,document.body.scrollHeight);return 'scrolled '+document.body.scrollHeight})()"},
            {"name":"en-privacy","until":"/en/privacy$","wait":4000,"js":"(function(){location.assign('/en/privacy');return 'assigned /en/privacy'})()"},
            {"name":"en-terms","until":"/en/terms$","wait":4000,"js":"(function(){location.assign('/en/terms');return 'assigned /en/terms'})()"},
            {"name":"en-refund","until":"/en/refund$","wait":4000,"js":"(function(){location.assign('/en/refund');return 'assigned /en/refund'})()"},
            {"name":"en-about","until":"/en/about$","wait":4000,"js":"(function(){location.assign('/en/about');return 'assigned /en/about'})()"},
            {"name":"en-contact","until":"/en/contact$","wait":4000,"js":"(function(){location.assign('/en/contact');return 'assigned /en/contact'})()"},
            {"name":"ar-home","until":"/ar/dashboard$","wait":4000,"js":"(function(){location.assign('/ar/dashboard');return 'assigned /ar/dashboard'})()"},
            {"name":"ar-subjects","until":"/ar/dashboard/knowledge$","wait":4000,"js":"(function(){location.assign('/ar/dashboard/knowledge');return 'assigned /ar/dashboard/knowledge'})()"},
            {"name":"ar-ask","until":"/ar/dashboard/agent$","wait":4000,"js":"(function(){location.assign('/ar/dashboard/agent');return 'assigned /ar/dashboard/agent'})()"},
            {"name":"ar-settings","until":"/ar/dashboard/settings$","wait":4000,"js":"(function(){location.assign('/ar/dashboard/settings');return 'assigned /ar/dashboard/settings'})()"},
            {"name":"ar-reminder-on","wait":3000,"js":"(function(){var c=document.querySelector('[data-kf-reminder-state]');if(!c){return 'no reminder card'}if(c.getAttribute('data-kf-reminder-state')!=='off'){return 'not off: '+c.getAttribute('data-kf-reminder-state')}var b=c.querySelector('[data-kf-reminder=toggle]');if(!b){return 'no toggle'}b.click();return 'clicked on'})()"},
            {"name":"ar-reminder-clock","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-reminder-state]');if(!c){return 'no reminder card'}c.scrollIntoView({block:'center'});var k=c.querySelector('[data-kf-reminder-clock]');var s=c.querySelector('[aria-live]');return c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time')+' | '+(k?k.textContent:'no clock')+' | '+(s?s.textContent:'no state line')})()"},
            {"name":"ar-reminder-off","wait":3000,"js":"(function(){var b=document.querySelector('[data-kf-reminder=toggle]');if(!b){return 'no toggle'}b.click();return 'clicked off'})()"},
            {"name":"ar-reminder-read-off","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-reminder-state]');return c?c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time'):'no reminder card'})()"},
            {"name":"ar-reminder-pending-off","until":"#kfP[0-9]+=","timeout":15000,"wait":300,"js":"(function(){var m=function(v){history.replaceState(history.state,'',location.pathname+location.search+'#kfP'+Date.now()+'='+encodeURIComponent(v))};window.Capacitor.nativePromise('LocalNotifications','getPending',{}).then(function(r){m(JSON.stringify(r.notifications.map(function(n){return {id:n.id,on:n.schedule&&n.schedule.on}})))},function(e){m('error '+e.message)});return 'asked'})()"},
            {"name":"ar-settings-bottom","wait":1500,"js":"(function(){window.scrollTo(0,document.body.scrollHeight);return 'scrolled '+document.body.scrollHeight})()"},
            {"name":"ar-privacy","until":"/ar/privacy$","wait":4000,"js":"(function(){location.assign('/ar/privacy');return 'assigned /ar/privacy'})()"},
            {"name":"ar-terms","until":"/ar/terms$","wait":4000,"js":"(function(){location.assign('/ar/terms');return 'assigned /ar/terms'})()"},
            {"name":"ar-refund","until":"/ar/refund$","wait":4000,"js":"(function(){location.assign('/ar/refund');return 'assigned /ar/refund'})()"},
            {"name":"ar-about","until":"/ar/about$","wait":4000,"js":"(function(){location.assign('/ar/about');return 'assigned /ar/about'})()"},
            {"name":"ar-contact","until":"/ar/contact$","wait":4000,"js":"(function(){location.assign('/ar/contact');return 'assigned /ar/contact'})()"},
            {"name":"restore-en","until":"/en/dashboard$","wait":4000,"js":"(function(){location.assign('/en/dashboard');return 'assigned /en/dashboard'})()"}
          ]
          JSON
          steps=$(base64 < "$RUNNER_TEMP/steps.json" | tr -d '\n')
          xcrun simctl install "$UDID" "$APP_PATH"
          data=$(xcrun simctl get_app_container "$UDID" com.knowflow.app data)
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "App"' > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/log.pid"
          # The credentials travel as launch-environment variables only.
          # Provisional notifications (MainViewController.swift): the reminder's
          # switch is never stopped by a system prompt no one can tap here; the
          # prompt-only-after-a-tap rule is proven in ios-smoke.yml, proof 6.
          SIMCTL_CHILD_KF_SMOKE=1 SIMCTL_CHILD_KF_SMOKE_NOTIFY=provisional SIMCTL_CHILD_KF_SMOKE_STEPS="$steps" SIMCTL_CHILD_KF_SMOKE_EMAIL="$KF_SMOKE_EMAIL" SIMCTL_CHILD_KF_SMOKE_PASSWORD="$KF_SMOKE_PASSWORD" xcrun simctl launch "$UDID" com.knowflow.app --kf-smoke &
          sf() { find "$data/tmp" -maxdepth 3 -name "$1" 2>/dev/null | head -n 1; }
          seen=0
          for i in $(seq 1 360); do
            f=$(sf smoke.jsonl); n=0; [ -n "$f" ] && n=$(wc -l < "$f" | tr -d ' ')
            if [ "$n" -gt "$seen" ]; then
              seen=$n
              name=$(tail -n 1 "$f" | python3 -c 'import json,sys; print(json.loads(sys.stdin.readline())["step"])')
              xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/signed-in-$seen-$name.png" >/dev/null 2>&1 || true
              echo "step $seen ($name): $(tail -n 1 "$f" | cut -c1-300)"
              # The app waits for this file before its next step (MainViewController.afterAck).
              touch "$(dirname "$f")/ack-$seen"
            fi
            [ -n "$(sf smoke.done)" ] && break
            sleep 1
          done
          f=$(sf smoke.jsonl); [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/smoke-signed-in.jsonl"
          xcrun simctl terminate "$UDID" com.knowflow.app || true
          kill "$(cat "$RUNNER_TEMP/log.pid")" 2>/dev/null || true
          # The last line of defence for the artifact: neither credential may
          # appear in anything kept, whatever the app recorded.
          if grep -qF -- "$KF_SMOKE_PASSWORD" "$RUNNER_TEMP/smoke-signed-in.jsonl" "$RUNNER_TEMP/app.log" 2>/dev/null; then echo "FAIL: a credential reached a recorded file"; rm -f "$RUNNER_TEMP/smoke-signed-in.jsonl" "$RUNNER_TEMP/app.log"; exit 1; fi
          test -n "$(sf smoke.done)" || { echo "FAIL: the run did not finish; lines seen: $seen"; grep -iE 'KFSmoke|crash|fatal' "$RUNNER_TEMP/app.log" | tail -n 30 || true; exit 1; }

      - name: Assert the signed-in screens and the 3.1.3(f) reading
        if: ${{ inputs.scenario == 'screens' }}
        run: |
          python3 - "$RUNNER_TEMP/smoke-signed-in.jsonl" "$RUNNER_TEMP/steps.json" <<'PY'
          import json, re, sys, urllib.parse
          rows = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          ROWS, STEPS = rows, sys.argv[2]
          by = {r["step"]: r for r in rows}
          fails = []
          def need(cond, msg):
              print(("ok   " if cond else "FAIL ") + msg)
              if not cond: fails.append(msg)
          def P(name): return by.get(name, {}).get("probe", {})
          # A page is the URL without its # part: the pending-reminder reads
          # leave their answer in the hash, and the page stays the same page
          # (run 38592947638 failed ar-settings-bottom on /ar/dashboard/settings#kfP...).
          def url(p): return (p.get("href", "") or "").split("#", 1)[0]
          L = P("launch")
          need(re.match(r"^https://tryknowflow\.com/(en|ar)/login$", url(L)), f"the first page is the login twin: {L.get('href')}")
          need(L.get("google") == 0 and L.get("bridge") is True, f"...the twin, with the bridge: google={L.get('google')} bridge={L.get('bridge')}")
          # The line for Google-registered students: on the app's login page
          # (no Google button there), linking to the page's own forgot link.
          GH = str(by.get("google-hint", {}).get("result", ""))
          need("Google" in GH and GH.endswith("/forgot-password") and "Forgot your password?" in GH, f"the login page in the app tells a Google-registered student to use the forgot link: {GH}")
          need(by.get("login", {}).get("result") == "submitted", f"the login form was filled and submitted: {by.get('login', {}).get('result')}")
          H = P("home")
          need(re.search(r"/(en|ar)/dashboard$", url(H)), f"the dashboard opened after sign-in: {H.get('href')}")
          need(H.get("signedIn") is True, f"...signed in (the Settings link is in the chrome): {H.get('signedIn')}")
          S = P("subject")
          need(re.search(r"/dashboard/knowledge/[0-9a-f-]{36}$", url(S)), f"a subject opened: {S.get('href')}")
          need("photosynthesis" in (S.get("text", "") or "").lower(), f"...and it lists the seeded material: {S.get('text', '')[:120]}")
          need(by.get("summary", {}).get("result") == "scrolled to summary", f"the summary is on the subject page: {by.get('summary', {}).get('result')}")
          need(by.get("quiz-open", {}).get("result") == "clicked quiz", f"the quiz button is on the subject page: {by.get('quiz-open', {}).get('result')}")
          # Apple 5.1.2(i): the first quiz asks first, naming both companies.
          need(by.get("consent", {}).get("result") == "accepted: Anthropic, Voyage AI", f"the AI permission sheet opened before the quiz, named both companies and was accepted: {by.get('consent', {}).get('result')}")
          need(by.get("quiz", {}).get("result") == "scrolled to quiz", f"the quiz (served from its cache) is on screen with its answer button: {by.get('quiz', {}).get('result')}")
          A = P("ask")
          need(re.search(r"/dashboard/agent$", url(A)), f"the Ask screen opened: {A.get('href')}")
          T = P("settings")
          need(re.search(r"/dashboard/settings$", url(T)), f"Settings opened: {T.get('href')}")
          # Settings shows the permission as given, and withdrawing it is saved:
          # this also leaves the reviewer account as App Review must find it,
          # without the permission, so the reviewer meets the sheet.
          need(by.get("consent-on", {}).get("result") == "on", f"Settings shows the permission given: {by.get('consent-on', {}).get('result')}")
          need(by.get("consent-withdraw", {}).get("result") == "clicked withdraw", f"the withdraw button is there: {by.get('consent-withdraw', {}).get('result')}")
          need(by.get("consent-off", {}).get("result") == "off", f"...and withdrawing turned it off: {by.get('consent-off', {}).get('result')}")
          # STORE_PATH.md S3(a): the study reminder card, inside the app only,
          # off at 19:00 until the switch is used; on schedules one daily
          # reminder, a new time replaces it, off cancels it.
          # The pending reminders, as the plugin answered: the step writes the
          # answer into the URL's hash and is a page step on it, so the harness
          # waits for the answer itself (15 s) instead of reading a fixed
          # 300 ms later (run 38578987525 read 'pending' after switching on).
          def pend(name):
              m = re.search(r"#kfP[0-9]+=(.*)$", P(name).get("href", "") or "")
              raw = urllib.parse.unquote(m.group(1)) if m else f"no answer: {by.get(name, {}).get('result')}"
              try: return [(n.get("id"), (n.get("on") or {}).get("hour"), (n.get("on") or {}).get("minute")) for n in json.loads(raw)]
              except Exception: return raw
          need(by.get("reminder-card", {}).get("result") == "off 19:00", f"the reminder card is in Settings, off, at 19:00: {by.get('reminder-card', {}).get('result')}")
          need(by.get("reminder-read-on", {}).get("result") == "on 19:00" and pend("reminder-pending-on") == [(7001, 19, 0)], f"switching it on schedules one daily reminder at 19:00: {by.get('reminder-read-on', {}).get('result')} {pend('reminder-pending-on')}")
          need(by.get("reminder-read-time", {}).get("result") == "on 07:30" and pend("reminder-pending-time") == [(7001, 7, 30)], f"a new time replaces it: {by.get('reminder-read-time', {}).get('result')} {pend('reminder-pending-time')}")
          need(by.get("reminder-read-off", {}).get("result") == "off 07:30" and pend("reminder-pending-off") == [], f"switching it off cancels it: {by.get('reminder-read-off', {}).get('result')} {pend('reminder-pending-off')}")
          # Step Redesign-3: the reminder's time in Arabic, as the student reads
          # it in the simulator whatever the engine's own locale (a native time
          # input drew "07:00 PM" on /ar): the clock beside the picker and the
          # state line both read "7:00 م", Western digits, the Arabic marker,
          # no Latin AM/PM. The shot of this step is kept with the others
          # (signed-in-<n>-ar-reminder-clock.png). Then off again, nothing left.
          def clk(v): return re.sub(r"[‎‏؜⁦-⁩]", "", v or "").replace(" ", " ").replace(" ", " ")
          RC = clk(str(by.get("ar-reminder-clock", {}).get("result", "")))
          parts = [x.strip() for x in RC.split("|")]
          need(by.get("ar-reminder-on", {}).get("result") == "clicked on", f"the Arabic Settings shows the reminder off and switches it on: {by.get('ar-reminder-on', {}).get('result')}")
          need(len(parts) == 3 and parts[0] == "on 19:00" and re.fullmatch("7:00 م", parts[1]) is not None and "7:00 م" in parts[2] and not re.search(r"(?i)\b[ap]\.?m\b", RC), f"the Arabic reminder reads its time in Arabic, beside the picker and in the sentence: {RC}")
          need(by.get("ar-reminder-read-off", {}).get("result") == "off 19:00" and pend("ar-reminder-pending-off") == [], f"...and switching it off cancels it: {by.get('ar-reminder-read-off', {}).get('result')} {pend('ar-reminder-pending-off')}")
          # Step Wording-1: the legal and site twins and the main screens in
          # Arabic too, each read on the page it was sent to (a bounce to the
          # login page would read clean and prove nothing).
          VISITED = {"en-privacy": r"/en/privacy$", "en-terms": r"/en/terms$", "en-refund": r"/en/refund$", "en-about": r"/en/about$", "en-contact": r"/en/contact$", "ar-home": r"/ar/dashboard$", "ar-subjects": r"/ar/dashboard/knowledge$", "ar-ask": r"/ar/dashboard/agent$", "ar-settings": r"/ar/dashboard/settings$", "ar-settings-bottom": r"/ar/dashboard/settings$", "ar-privacy": r"/ar/privacy$", "ar-terms": r"/ar/terms$", "ar-refund": r"/ar/refund$", "ar-about": r"/ar/about$", "ar-contact": r"/ar/contact$"}
          for name, path in VISITED.items():
              need(re.search(path, url(P(name))), f"{name} opened its page: {P(name).get('href')}")
          for name in ("home", "home-bottom", "subjects", "subject", "summary", "quiz-open", "consent", "quiz", "ask", "settings", "consent-on", "consent-off", "reminder-card", "reminder-read-on", "reminder-read-off", "settings-bottom", "ar-reminder-clock", *VISITED):
              p = P(name).get("purchase", {}) or {}
              need(not p.get("words") and not p.get("hrefs"), f"3.1.3(f) on {name}: no plan, subscription, upgrade, price or free word (scripts/lib/app-wording.mjs) and no purchase link: words={p.get('words')} hrefs={p.get('hrefs')}")
              need(P(name).get("google") == 0, f"no Google button on {name}: {P(name).get('google')}")
          # Every page step (a step naming `until`) left the page it started on
          # and reached its own before its reading, or fails here: never read
          # as the page before it (run 38426358277, ar-terms on /ar/privacy).
          sys.path.insert(0, "scripts/ios")
          from page_steps import page_step_checks
          for ok, msg in page_step_checks(ROWS, [json.load(open(STEPS))]):
              need(ok, msg)
          print(f"\n{len(fails)} failure(s) of {len(rows)} readings")
          sys.exit(1 if fails else 0)
          PY

      # THE BACKGROUND-UPLOAD MEASUREMENT (PROGRESS.md 2026-10-09, T5 replaced by
      # the simulator). Dispatch only, scenario background-upload. The reviewer
      # account gives the AI permission in Settings, then uploads two files of
      # 4,000,000 spaces through the real drop zone of its subject: a file with
      # no text, so the ingestion service finds nothing to embed and nothing
      # reaches Voyage AI or Anthropic (no cost), while the request is the same
      # 4 MB a student sends. The moment the file is picked the workflow sends
      # the app to the background (by opening the Settings app), so the app is
      # away while the server is still answering, for 30 s and then 120 s, past
      # iOS's background grace period. A monitor in the page logs every event
      # of the request, the page's visibility and the drop zone's sentence with
      # the wall clock; this step logs when the app left and came back, with
      # its process id, and photographs the screen at each point. Every
      # kf-bg-upload material is then deleted through its own Delete control,
      # and the AI permission is withdrawn in Settings at the end. The e-mail
      # mask of the probe applies to every screenshot. (Throttling this
      # runner's link with dummynet was tried first, run 37926583892, and had
      # no effect on the simulator's traffic: the bytes left in 0.2 s.)
