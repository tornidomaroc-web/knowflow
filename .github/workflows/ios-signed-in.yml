          JSON
          steps=$(base64 < "$RUNNER_TEMP/steps.json" | tr -d '\n')
          T="$RUNNER_TEMP/bg-timeline.txt"; : > "$T"
          now() { python3 -c 'import time; print(int(time.time()*1000))'; }
          apppid() { xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | awk '/UIKitApplication:com\.knowflow\.app/{print $1; exit}'; }
          shot() { xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$1.png" >/dev/null 2>&1 || true; }
          away() {
            tag=$1; secs=$2
            pid0=$(apppid)
            xcrun simctl launch "$UDID" com.apple.Preferences >/dev/null
            echo "$(now) $tag background (app pid $pid0)" >> "$T"
            sleep 2; shot "$tag-away"
            sleep $((secs - 2))
            xcrun simctl launch "$UDID" com.knowflow.app >/dev/null
            sleep 1
            echo "$(now) $tag foreground (app pid $(apppid))" >> "$T"
            sleep 1; shot "$tag-back"
          }
          xcrun simctl install "$UDID" "$APP_PATH"
          data=$(xcrun simctl get_app_container "$UDID" com.knowflow.app data)
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "App"' > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/log.pid"
          SIMCTL_CHILD_KF_SMOKE=1 SIMCTL_CHILD_KF_SMOKE_STEPS="$steps" SIMCTL_CHILD_KF_SMOKE_EMAIL="$KF_SMOKE_EMAIL" SIMCTL_CHILD_KF_SMOKE_PASSWORD="$KF_SMOKE_PASSWORD" xcrun simctl launch "$UDID" com.knowflow.app --kf-smoke &
          sf() { find "$data/tmp" -maxdepth 3 -name "$1" 2>/dev/null | head -n 1; }
          seen=0
          for i in $(seq 1 4000); do
            f=$(sf smoke.jsonl); n=0; [ -n "$f" ] && n=$(wc -l < "$f" | tr -d ' ')
            if [ "$n" -gt "$seen" ]; then
              seen=$n
              name=$(tail -n 1 "$f" | python3 -c 'import json,sys; print(json.loads(sys.stdin.readline())["step"])')
              echo "$(now) line $seen $name" >> "$T"
              # The app leaves first and is photographed after: the request is
              # out for seconds only, and a screenshot takes one.
              case "$name" in
                bg-1-start) away bg-1 30 ;;
                bg-2-start) away bg-2 120 ;;
                *) shot "bg-$seen-$name" ;;
              esac
              echo "step $seen ($name): $(tail -n 1 "$f" | python3 -c 'import json,sys; r=json.loads(sys.stdin.readline()); print(str(r.get("result"))[:300], "| appState", r.get("appState"))')"
              touch "$(dirname "$f")/ack-$seen"
            fi
            [ -n "$(sf smoke.done)" ] && break
            sleep 0.25
          done
          f=$(sf smoke.jsonl); [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/smoke-bg.jsonl"
          xcrun simctl terminate "$UDID" com.knowflow.app || true
          kill "$(cat "$RUNNER_TEMP/log.pid")" 2>/dev/null || true
          if grep -qF -- "$KF_SMOKE_PASSWORD" "$RUNNER_TEMP/smoke-bg.jsonl" "$RUNNER_TEMP/app.log" 2>/dev/null; then echo "FAIL: a credential reached a recorded file"; rm -f "$RUNNER_TEMP/smoke-bg.jsonl" "$RUNNER_TEMP/app.log"; exit 1; fi
          test -n "$(sf smoke.done)" || { echo "FAIL: the run did not finish; lines seen: $seen"; exit 1; }

      - name: Report the background-upload measurement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'background-upload' }}
        run: |
          python3 - "$RUNNER_TEMP/smoke-bg.jsonl" "$RUNNER_TEMP/bg-timeline.txt" <<'PY'
          import json, sys
          rows = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          by = {r["step"]: r for r in rows}
          tl = [l.split(" ", 1) for l in open(sys.argv[2]).read().splitlines() if l.strip()]
          fails = []
          def need(cond, msg):
              print(("ok   " if cond else "FAIL ") + msg)
              if not cond: fails.append(msg)
          print("timeline (ms, runner clock):")
          for t, what in tl: print("  ", t, what)
          print("\nAI permission:", by.get("allow", {}).get("result"), "/", by.get("allow-accept", {}).get("result"))
          print("left from before:", by.get("cleanup-0-open", {}).get("result"), "/", by.get("cleanup-0-confirm", {}).get("result"), "/", by.get("cleanup-0-check", {}).get("result"))
          for n in (1, 2):
              print(f"\n===== upload {n}")
              print("  start:", by.get(f"bg-{n}-start", {}).get("result"))
              try:
                  ev = json.loads(by.get(f"bg-{n}-report", {}).get("result") or "[]")
              except Exception:
                  ev = []
              bg = [int(t) for t, w in tl if w.startswith(f"bg-{n} background")]
              fg = [int(t) for t, w in tl if w.startswith(f"bg-{n} foreground")]
              send = next((t for t, e in ev if e == "xhr:send"), None)
              for t, e in ev:
                  rel = (t - send) / 1000 if send else 0
                  print(f"  {rel:8.1f} s  {e}")
              if send and bg and fg:
                  print(f"  away from {(bg[0]-send)/1000:.1f} s to {(fg[0]-send)/1000:.1f} s after the send")
              end = next(((t, e) for t, e in ev if e.startswith(("xhr:load", "xhr:error", "xhr:abort", "xhr:timeout"))), None)
              print("  end:", (f"{(end[0]-send)/1000:.1f} s {end[1]}" if end and send else "NONE: the request never ended in the page"))
              for k in range(1, 5):
                  r = by.get(f"bg-{n}-observe-{k}", {}).get("result")
                  if r: print(f"  observe {k}:", r[:220])
              print("  cleanup:", by.get(f"cleanup-{n}-open", {}).get("result"), "/", by.get(f"cleanup-{n}-confirm", {}).get("result"), "/", by.get(f"cleanup-{n}-check", {}).get("result"))
              need(bool(send), f"upload {n} was sent")
              need(bool(bg and send and end) and bg[0] < end[0], f"upload {n}: the app left before the request ended (the measurement is valid)")
          need(by.get("consent-off", {}).get("result") == "off", f"the reviewer account is left without the AI permission: {by.get('consent-off', {}).get('result')}")
          for tag in ("0", "1", "2"):
              need(by.get(f"cleanup-{tag}-check", {}).get("result") == "left 0", f"no kf-bg-upload material left after cleanup {tag}: {by.get(f'cleanup-{tag}-check', {}).get('result')}")
          print(f"\n{len(fails)} failure(s)")
          sys.exit(1 if fails else 0)
          PY

      # THE APP STORE SCREENSHOTS (STORE_PATH.md S6, guideline 2.3.3: the app in
      # use). Step Store-Shots-1: dispatch only on main, scenario screenshots,
      # environment `screenshots` (the job's environment follows the scenario).
      # Two accounts, one per language, so no Arabic shot shows an English
      # subject and no English shot an Arabic one: +kfshots-ar, then
      # +kfshots-en, each filled by store-seed.yml from
      # docs/store/screenshot-content/plan.json. The reviewer account is not
      # used, and no mail is sent (the recovery-link probe of the first set is
      # gone). A Pro Max simulator with Apple's marketing status bar (boot
      # step), the live site. The steps come from scripts/store-seed/
      # capture_steps.py; each shot-* line is saved as store/<locale>/<NN-name>.png
      # and must be 1320 x 2868. Every probe masks e-mail text before a
      # screenshot. The reminder is switched on at 19:00 for the Settings shot
      # and the accounts keep their AI permission (the owner's ruling); each
      # set ends signed out. AI calls a capture makes: one Ask question (the
      # Arabic 04 shot; citations are not stored, so a reopened answer would
      # show no sources); the English quiz is the stored one.
      - name: App Store screenshots against the live site (two screenshot accounts)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'screenshots' }}
        env:
          AR_EMAIL: ${{ secrets.SHOTS_AR_EMAIL }}
          AR_PASSWORD: ${{ secrets.SHOTS_AR_PASSWORD }}
          EN_EMAIL: ${{ secrets.SHOTS_EN_EMAIL }}
          EN_PASSWORD: ${{ secrets.SHOTS_EN_PASSWORD }}
        run: |
          set -eu
          for v in AR_EMAIL AR_PASSWORD EN_EMAIL EN_PASSWORD; do test -n "${!v}" || { echo "$v is empty"; exit 1; }; done
          mkdir -p "$RUNNER_TEMP/store/en" "$RUNNER_TEMP/store/ar"
          echo "device: $(xcrun simctl list devices | grep "$UDID")"
          xcrun simctl install "$UDID" "$APP_PATH"
          data=$(xcrun simctl get_app_container "$UDID" com.knowflow.app data)
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "App"' > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/log.pid"
          sf() { find "$data/tmp" -maxdepth 3 -name "$1" 2>/dev/null | head -n 1; }
          : > "$RUNNER_TEMP/smoke-shots.jsonl"
          capture() {
            loc=$1 email=$2 password=$3
            python3 scripts/store-seed/capture_steps.py "$loc" > "$RUNNER_TEMP/steps-$loc.json"
            steps=$(base64 < "$RUNNER_TEMP/steps-$loc.json" | tr -d '\n')
            # The app writes smoke.* and its acks straight in $data/tmp (its
            # temporaryDirectory); the previous set's acks left there let the
            # next set run without waiting for a single screenshot (run
            # 38464393735: en/04-quiz.png was the Settings screen). Delete
            # them as ios-smoke.yml does, and prove none is left.
            find "$data/tmp" -maxdepth 3 \( -name 'smoke.*' -o -name 'ack-*' \) -delete 2>/dev/null || true
            test -z "$(find "$data/tmp" -maxdepth 3 -name 'ack-*' 2>/dev/null)" || { echo "FAIL: acks of an earlier set are still there"; return 1; }
            ahead=0
            SIMCTL_CHILD_KF_SMOKE=1 SIMCTL_CHILD_KF_SMOKE_NOTIFY=provisional SIMCTL_CHILD_KF_SMOKE_STEPS="$steps" SIMCTL_CHILD_KF_SMOKE_EMAIL="$email" SIMCTL_CHILD_KF_SMOKE_PASSWORD="$password" xcrun simctl launch --terminate-running-process "$UDID" com.knowflow.app --kf-smoke &
            seen=0
            for i in $(seq 1 1200); do
              f=$(sf smoke.jsonl); n=0; [ -n "$f" ] && n=$(wc -l < "$f" | tr -d ' ')
              if [ "$n" -gt "$seen" ]; then
                seen=$n
                # The app waits for ack-n only if ack-n is not there yet: one
                # already there means the app went on without waiting, and the
                # screenshot below may show a later step (run 38464393735).
                if [ -e "$(dirname "$f")/ack-$seen" ]; then echo "FAIL: ack-$seen of the $loc set was there before its screenshot"; ahead=1; fi
                name=$(tail -n 1 "$f" | python3 -c 'import json,sys; print(json.loads(sys.stdin.readline())["step"])')
                case "$name" in
                  shot-en-*) out="$RUNNER_TEMP/store/en/${name#shot-en-}.png" ;;
                  shot-ar-*) out="$RUNNER_TEMP/store/ar/${name#shot-ar-}.png" ;;
                  *) out="$RUNNER_TEMP/shots/s-$loc-$seen-$name.png" ;;
                esac
                xcrun simctl io "$UDID" screenshot --type=png "$out" >/dev/null 2>&1 || true
                echo "$loc step $seen ($name): $(tail -n 1 "$f" | python3 -c 'import json,sys; r=json.loads(sys.stdin.readline()); print(str(r.get("result"))[:220], "| purchase", (r.get("probe") or {}).get("purchase"))')"
                touch "$(dirname "$f")/ack-$seen"
              fi
              [ -n "$(sf smoke.done)" ] && break
              sleep 0.5
            done
            f=$(sf smoke.jsonl); [ -n "$f" ] && cat "$f" >> "$RUNNER_TEMP/smoke-shots.jsonl"
            test -n "$(sf smoke.done)" || { echo "FAIL: the $loc set did not finish; lines seen: $seen"; return 1; }
            test "$ahead" = 0 || { echo "FAIL: the $loc app did not wait for its screenshots; they may not match their steps"; return 1; }
            xcrun simctl terminate "$UDID" com.knowflow.app || true
          }
          status=0
          capture ar "$AR_EMAIL" "$AR_PASSWORD" || status=1
          capture en "$EN_EMAIL" "$EN_PASSWORD" || status=1
          kill "$(cat "$RUNNER_TEMP/log.pid")" 2>/dev/null || true
          for secret in "$AR_PASSWORD" "$EN_PASSWORD" "$AR_EMAIL" "$EN_EMAIL"; do
            if grep -qF -- "$secret" "$RUNNER_TEMP/smoke-shots.jsonl" "$RUNNER_TEMP/app.log" 2>/dev/null; then echo "FAIL: a credential or account address reached a recorded file"; rm -f "$RUNNER_TEMP/smoke-shots.jsonl" "$RUNNER_TEMP/app.log"; exit 1; fi
          done
          exit $status

      - name: Check the screenshots and the readings
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'screenshots' }}
        run: |
          set -eu
          for f in "$RUNNER_TEMP"/store/*/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}'); h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            echo "$(basename "$(dirname "$f")")/$(basename "$f"): ${w} x ${h}, $(stat -f %z "$f") bytes"
          done > "$RUNNER_TEMP/store/sizes.txt"
          cat "$RUNNER_TEMP/store/sizes.txt"
          python3 scripts/store-seed/check_capture.py "$RUNNER_TEMP/smoke-shots.jsonl" "$RUNNER_TEMP/store/sizes.txt" "$RUNNER_TEMP/steps-ar.json" "$RUNNER_TEMP/steps-en.json"

      - name: Keep the store screenshots
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.scenario == 'screenshots' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/store
          if-no-files-found: error
          retention-days: 30

      - name: Shut the simulator down
        if: always()
        run: xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Keep the screenshots, readings and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-signed-in-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/smoke-signed-in.jsonl
            ${{ runner.temp }}/smoke-bg.jsonl
            ${{ runner.temp }}/smoke-shots.jsonl
            ${{ runner.temp }}/bg-timeline.txt
            ${{ runner.temp }}/app.log
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14

  # Step Store-Shots-1: the capture, framed and committed for review. Runs
  # after an App Store capture (dispatch on main, scenario screenshots), or on
  # its own as the FRAME MODE (scenario frame, source_run = an earlier
  # screenshots run on main): it then reuses that run's capture instead of
  # taking a new one, so no macOS minute and no AI call. The source must be a
  # completed dispatch of this workflow on main whose capture step succeeded,
  # and its readings must pass check_capture.py again with one allowance
  # only: a page step that reached its own page after its limit (KF_LATE_OK,
  # scripts/ios/page_steps.py; run 38579234295's 32.75 s login).
  # Linux, no environment, no secret: it takes the raw PNGs the macOS job
  # kept, puts them in docs/store/screenshots, frames them with the approved
  # pipeline (scripts/store-shots/render.mjs: Rubik, #14110d, #d4a548, the
  # owner's captions), runs the pipeline's own checks (size and alpha, the
  # app screen uncovered, OCR for e-mail, account and price words) and
  # pushes the raw and framed PNGs to a new branch store/shots-<capture run
  # id>. It never pushes to main (protected); the review PR is opened from
  # that branch, where store-shots.yml checks the set again.
  frame:
    needs: signed-in
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && ((inputs.scenario == 'screenshots' && needs.signed-in.result == 'success') || inputs.scenario == 'frame') }}
    name: Frame the App Store capture and push it to a review branch (Linux, no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: The capture run, and in the frame mode its proof
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ inputs.scenario }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -eu
          if [ "$SCENARIO" = screenshots ]; then
            echo "run=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"; echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$SOURCE_RUN" | grep -qE '^[0-9]+$' || { echo "FAIL: source_run must be a run id, got '$SOURCE_RUN'"; exit 1; }
          src=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '[.path, .event, .head_branch, .status, .head_sha] | join(" ")')
          read -r path event branch status sha <<< "$src"
          echo "source run $SOURCE_RUN: $path, $event on $branch, $status, $sha"
          test "$path" = .github/workflows/ios-signed-in.yml && test "$event" = workflow_dispatch && test "$branch" = main && test "$status" = completed || { echo "FAIL: not a completed dispatch of this workflow on main"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "FAIL: $sha is not on main"; exit 1; }
          capture=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" --jq '[.jobs[].steps[] | select(.name == "App Store screenshots against the live site (two screenshot accounts)") | .conclusion][0] // "absent"')
          echo "its capture step: $capture"
          test "$capture" = success || { echo "FAIL: the source run's capture step did not succeed (a screens run has none)"; exit 1; }
          echo "run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: The raw capture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: store-screenshots-${{ steps.src.outputs.sha }}
          path: ${{ runner.temp }}/store
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ github.token }}

      - name: The capture's readings (frame mode)
        if: ${{ inputs.scenario == 'frame' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-signed-in-${{ steps.src.outputs.sha }}
          path: ${{ runner.temp }}/readings
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ github.token }}

      # The capture's own checks again, with the steps of the commit it ran
      # (capture_steps.py there), so a reused capture is held to what a fresh
      # one is; the one allowance is KF_LATE_OK, above.
      - name: The capture's checks again (frame mode)
        if: ${{ inputs.scenario == 'frame' }}
        env:
          SHA: ${{ steps.src.outputs.sha }}
          KF_LATE_OK: '1'
        run: |
          set -eu
          git worktree add --detach "$RUNNER_TEMP/at-capture" "$SHA"
          python3 "$RUNNER_TEMP/at-capture/scripts/store-seed/capture_steps.py" ar > "$RUNNER_TEMP/steps-ar.json"
          python3 "$RUNNER_TEMP/at-capture/scripts/store-seed/capture_steps.py" en > "$RUNNER_TEMP/steps-en.json"
          git worktree remove --force "$RUNNER_TEMP/at-capture"
          python3 scripts/store-seed/check_capture.py "$RUNNER_TEMP/readings/smoke-shots.jsonl" "$RUNNER_TEMP/store/sizes.txt" "$RUNNER_TEMP/steps-ar.json" "$RUNNER_TEMP/steps-en.json"

      - name: Raw PNGs into docs/store/screenshots, framed into docs/store/screenshots-designed
        env:
          CHROME: google-chrome
        run: |
          set -eu
          for loc in en ar; do
            test "$(ls "$RUNNER_TEMP/store/$loc"/*.png | wc -l)" -eq 5
            cp "$RUNNER_TEMP/store/$loc"/*.png "docs/store/screenshots/$loc/"
          done
          cp "$RUNNER_TEMP/store/sizes.txt" docs/store/screenshots/sizes.txt
          node scripts/store-shots/render.mjs

      - name: The pipeline's own checks on the framed set
        run: |
          set -eu
          python3 -m pip install --quiet --disable-pip-version-check "pillow==12.2.0"
          python3 scripts/store-shots/check.py docs/store/screenshots-designed/*/*.png
          python3 scripts/store-shots/screen_intact.py docs/store/screenshots-designed
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng > /dev/null
          python3 scripts/store-shots/ocr_scan.py docs/store/screenshots-designed/*/*.png

      - name: Push the raw and framed set to store/shots-${{ steps.src.outputs.run }}
        env:
          BRANCH: store/shots-${{ steps.src.outputs.run }}
          SRC: ${{ steps.src.outputs.run }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/store/screenshots docs/store/screenshots-designed
          git commit -m "docs: App Store screenshots captured by ios-signed-in run $SRC (two screenshot accounts), raw and framed by run $GITHUB_RUN_ID"
          git push origin "$BRANCH"
          echo "pushed $BRANCH: open the review PR from it"
