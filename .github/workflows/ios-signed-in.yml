name: ios-signed-in

# The signed-in screens of the iOS shell, proven in the Simulator against the
# live site with the dedicated reviewer account (docs/store/STORE_PATH.md S8,
# PROGRESS.md 2026-10-08): the dashboard, the subject and its material, the
# summary and the quiz, Ask, Settings. On every one of those screens the probe
# in MainViewController.swift takes the Apple 3.1.3(f) reading: no price, plan,
# upgrade or checkout word or link anywhere in the page, in either locale. A
# hit fails the run. The first quiz meets the AI permission sheet of Apple
# 5.1.2(i) (src/lib/ai-consent.ts): the run checks that it names Anthropic and
# Voyage AI, accepts it, and withdraws it again in Settings at the end, so the
# reviewer account is left without the permission and App Review meets the
# sheet too. A run that stops between the two leaves it given; the next run
# then fails the sheet reading but still withdraws it at its end, and the one
# after is green.
#
# SECRETS, AND WHERE THEY CAN BE READ. The reviewer account's e-mail and
# password are the two secrets of the GitHub environment `reviewer`, which
# deploys from `main` alone (gh api repos/{owner}/{repo}/environments/reviewer:
# custom branch policy, `main`). This workflow never runs on pull_request, so
# a fork and a pull request have no path to the environment at all. The job
# runs no npm, no setup-node and no package script: the credentials sit on a
# runner that executes xcodebuild over the committed tree and nothing else
# (the drift check between capacitor.config.ts and the committed ios/ is
# ios-smoke.yml's job, on every pull request, with no secrets). The
# credentials reach the app only as launch-environment variables and are
# never part of the steps JSON (whose first bytes land in smoke.boot); the app
# scrubs every recorded line of them.
#
# WHAT A LEAK WOULD COST. The account is free, seeded with one subject and one
# material, and is the one App Review will use; nothing else is reachable with
# it. Its password is rotated with one `gh secret set` and one sign-in.
#
# COST. Standard macos-26 runner, free on this public repository (ios-smoke.yml).

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'native/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-signed-in.yml'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'screens: the signed-in screens (as on every push). background-upload: the measurement of an upload sent to the background (dispatch only)'
        type: choice
        options: [screens, background-upload]
        default: screens

permissions:
  contents: read

concurrency:
  group: ios-signed-in-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-in:
    name: iOS — simulator run of the signed-in screens with the reviewer account (no npm)
    runs-on: macos-26
    environment: reviewer
    timeout-minutes: 45
    steps:
      # git alone: checkout runs no repository script and no package hook.
      - name: Check out the commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Nothing but the committed tree is on this runner
        run: |
          set -eu
          test ! -e node_modules
          test -f ios/App/App/public/index.html
          test -f ios/App/App/capacitor.config.json
          test "$(git status --porcelain --untracked-files=no ios native capacitor.config.ts | wc -l | tr -d ' ')" -eq 0 || { echo "a tracked file changed after checkout"; git status --porcelain ios; exit 1; }

      # The one native plugin (the study reminder's) is a local Swift package
      # under node_modules/, which this job never creates with npm: the
      # tarball is fetched from the registry and refused unless its sha512 is
      # the one package-lock.json pins; nothing in it is run.
      - name: The native plugins, by their package-lock.json sha512 (no npm)
        run: python3 .github/scripts/fetch-native-plugins.py

      - name: Xcode in use
        run: |
          sudo xcode-select -p
          xcodebuild -version

      - name: Resolve Swift packages from the committed Package.resolved
        run: |
          set -eu -o pipefail
          resolved=ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          test -f "$resolved" || { echo "no committed Package.resolved"; exit 1; }
          cp "$resolved" "$RUNNER_TEMP/Package.resolved.committed"
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee "$RUNNER_TEMP/resolve.log" | { grep -E '^(warning|error|\*\*|Resolved|Fetching|Cloning|Creating)|: (error|warning):' || true; }
          cmp "$RUNNER_TEMP/Package.resolved.committed" "$resolved" || { echo "FAIL: the resolution rewrote the committed Package.resolved"; exit 1; }

      - name: Build for the iOS Simulator (unsigned)
        run: |
          set -eu -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | { grep -E '^(warning|error|\*\*|Build)|: (error|warning):' || true; }
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -n 1)
          test -n "$app" || { echo "no App.app was built"; tail -n 60 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Boot a simulator
        run: |
          set -eu
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[(r,x["udid"],x["name"]) for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]; c.sort(); print(c[-1][1])')
          test -n "$udid"
          echo "simulator: $(xcrun simctl list devices available | grep "$udid")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b | tail -n 2
          echo "UDID=$udid" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/shots"

      # The steps. The login step fills the twin's form through React's own
      # value setter and submits it; __KF_EMAIL__ and __KF_PASSWORD__ are bare
      # tokens here, replaced inside the app from the launch environment. Every
      # later step is a navigation or a scroll, each followed by the probe and a
      # screenshot. `l` is the locale the page is on.
      - name: Signed-in run against the live site
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scenario == 'screens' }}
        env:
          KF_SMOKE_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          KF_SMOKE_PASSWORD: ${{ secrets.REVIEWER_PASSWORD }}
        run: |
          set -eu
          test -n "$KF_SMOKE_EMAIL" || { echo "REVIEWER_EMAIL is empty"; exit 1; }
          test -n "$KF_SMOKE_PASSWORD" || { echo "REVIEWER_PASSWORD is empty"; exit 1; }
          cat > "$RUNNER_TEMP/steps.json" <<'JSON'
          [
            {"name":"login","wait":10000,"js":"(function(){var set=function(el,v){var s=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;s.call(el,v);el.dispatchEvent(new Event('input',{bubbles:true}))};var e=document.querySelector('input[name=email]'),p=document.querySelector('input[name=password]');if(!e||!p){return 'no login form'}set(e,__KF_EMAIL__);set(p,__KF_PASSWORD__);var f=e.form;if(!f){return 'no form'}setTimeout(function(){if(f.requestSubmit){f.requestSubmit()}else{f.submit()}},100);return 'submitted'})()"},
            {"name":"home","wait":3000,"js":"(function(){window.scrollTo(0,0);return location.pathname})()"},
            {"name":"home-bottom","wait":1500,"js":"(function(){window.scrollTo(0,document.body.scrollHeight);return 'scrolled '+document.body.scrollHeight})()"},
            {"name":"subjects","wait":8000,"js":"(function(){var a=document.querySelector('a[href$=\"/dashboard/knowledge\"]');if(!a){return 'no Subjects link'}a.click();return 'clicked Subjects'})()"},
            {"name":"subject","wait":10000,"js":"(function(){var a=Array.prototype.slice.call(document.querySelectorAll('a[href*=\"/dashboard/knowledge/\"]')).filter(function(a){return !/\\/new$/.test(a.getAttribute('href')||'')})[0];if(!a){return 'no subject link'}a.click();return 'clicked a subject'})()"},
            {"name":"summary","wait":2000,"js":"(function(){var h=Array.prototype.slice.call(document.querySelectorAll('h1,h2,h3,h4,p,span,div')).filter(function(x){return x.children.length===0&&/^(SUMMARY|Summary|الملخص|ملخص)$/.test((x.innerText||'').trim())})[0];if(!h){return 'no summary heading'}h.scrollIntoView({block:'start'});return 'scrolled to summary'})()"},
            {"name":"quiz-open","wait":4000,"js":"(function(){var b=Array.prototype.slice.call(document.querySelectorAll('button')).filter(function(x){return /Quiz me on this material|اختبرني في هذا الملف/.test(x.innerText||'')})[0];if(!b){return 'no quiz button'}b.click();return 'clicked quiz'})()"},
            {"name":"consent","wait":15000,"js":"(function(){var d=document.querySelector('[data-kf-consent-sheet=open]');if(!d){return 'no consent sheet'}var t=d.innerText||'';var names=['Anthropic','Voyage AI'].filter(function(n){return t.indexOf(n)>=0});var b=d.querySelector('[data-kf-consent=accept]');if(!b){return 'no accept button'}b.click();return 'accepted: '+names.join(', ')})()"},
            {"name":"quiz","wait":2000,"js":"(function(){var b=Array.prototype.slice.call(document.querySelectorAll('button')).filter(function(x){return /Check my answers|صحّح إجاباتي/.test(x.innerText||'')})[0];if(!b){return 'no quiz on screen'}b.scrollIntoView({block:'end'});return 'scrolled to quiz'})()"},
            {"name":"ask","wait":8000,"js":"(function(){var a=document.querySelector('a[href$=\"/dashboard/agent\"]');if(!a){return 'no Ask link'}a.click();return 'clicked Ask'})()"},
            {"name":"settings","wait":8000,"js":"(function(){var a=document.querySelector('a[href$=\"/dashboard/settings\"]');if(!a){return 'no Settings link'}a.click();return 'clicked Settings'})()"},
            {"name":"consent-on","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-consent-state]');if(!c){return 'no consent card'}c.scrollIntoView({block:'center'});return c.getAttribute('data-kf-consent-state')})()"},
            {"name":"consent-withdraw","wait":5000,"js":"(function(){var b=document.querySelector('[data-kf-consent=withdraw]');if(!b){return 'no withdraw button'}b.click();return 'clicked withdraw'})()"},
            {"name":"consent-off","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-consent-state]');if(!c){return 'no consent card'}return c.getAttribute('data-kf-consent-state')})()"},
            {"name":"reminder-card","wait":1500,"js":"(function(){var c=document.querySelector('[data-kf-reminder-state]');if(!c){return 'no reminder card'}c.scrollIntoView({block:'center'});return c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time')})()"},
            {"name":"reminder-on","wait":3000,"js":"(function(){var b=document.querySelector('[data-kf-reminder=toggle]');if(!b){return 'no toggle'}b.click();return 'clicked on'})()"},
            {"name":"reminder-read-on","wait":1500,"js":"(function(){window.__kfP='pending';window.Capacitor.nativePromise('LocalNotifications','getPending',{}).then(function(r){window.__kfP=JSON.stringify(r.notifications.map(function(n){return {id:n.id,on:n.schedule&&n.schedule.on}}))},function(e){window.__kfP='error '+e.message});var c=document.querySelector('[data-kf-reminder-state]');return c?c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time'):'no reminder card'})()"},
            {"name":"reminder-pending-on","wait":300,"js":"(function(){return String(window.__kfP)})()"},
            {"name":"reminder-time","wait":3000,"js":"(function(){var i=document.querySelector('[data-kf-reminder=time]');if(!i){return 'no time input'}var s=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;s.call(i,'07:30');i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));return 'set 07:30'})()"},
            {"name":"reminder-read-time","wait":1500,"js":"(function(){window.__kfP='pending';window.Capacitor.nativePromise('LocalNotifications','getPending',{}).then(function(r){window.__kfP=JSON.stringify(r.notifications.map(function(n){return {id:n.id,on:n.schedule&&n.schedule.on}}))},function(e){window.__kfP='error '+e.message});var c=document.querySelector('[data-kf-reminder-state]');return c?c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time'):'no reminder card'})()"},
            {"name":"reminder-pending-time","wait":300,"js":"(function(){return String(window.__kfP)})()"},
            {"name":"reminder-off","wait":3000,"js":"(function(){var b=document.querySelector('[data-kf-reminder=toggle]');if(!b){return 'no toggle'}b.click();return 'clicked off'})()"},
            {"name":"reminder-read-off","wait":1500,"js":"(function(){window.__kfP='pending';window.Capacitor.nativePromise('LocalNotifications','getPending',{}).then(function(r){window.__kfP=JSON.stringify(r.notifications.map(function(n){return {id:n.id,on:n.schedule&&n.schedule.on}}))},function(e){window.__kfP='error '+e.message});var c=document.querySelector('[data-kf-reminder-state]');return c?c.getAttribute('data-kf-reminder-state')+' '+c.getAttribute('data-kf-reminder-time'):'no reminder card'})()"},
            {"name":"reminder-pending-off","wait":300,"js":"(function(){return String(window.__kfP)})()"},
            {"name":"settings-bottom","wait":1500,"js":"(function(){window.scrollTo(0,document.body.scrollHeight);return 'scrolled '+document.body.scrollHeight})()"}
          ]
          JSON
          steps=$(base64 < "$RUNNER_TEMP/steps.json" | tr -d '\n')
          xcrun simctl install "$UDID" "$APP_PATH"
          data=$(xcrun simctl get_app_container "$UDID" com.knowflow.app data)
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "App"' > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/log.pid"
          # The credentials travel as launch-environment variables only.
          # Provisional notifications (MainViewController.swift): the reminder's
          # switch is never stopped by a system prompt no one can tap here; the
          # prompt-only-after-a-tap rule is proven in ios-smoke.yml, proof 6.
          SIMCTL_CHILD_KF_SMOKE=1 SIMCTL_CHILD_KF_SMOKE_NOTIFY=provisional SIMCTL_CHILD_KF_SMOKE_STEPS="$steps" SIMCTL_CHILD_KF_SMOKE_EMAIL="$KF_SMOKE_EMAIL" SIMCTL_CHILD_KF_SMOKE_PASSWORD="$KF_SMOKE_PASSWORD" xcrun simctl launch "$UDID" com.knowflow.app --kf-smoke &
          sf() { find "$data/tmp" -maxdepth 3 -name "$1" 2>/dev/null | head -n 1; }
          seen=0
          for i in $(seq 1 360); do
            f=$(sf smoke.jsonl); n=0; [ -n "$f" ] && n=$(wc -l < "$f" | tr -d ' ')
            if [ "$n" -gt "$seen" ]; then
              seen=$n
              name=$(tail -n 1 "$f" | python3 -c 'import json,sys; print(json.loads(sys.stdin.readline())["step"])')
              xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/signed-in-$seen-$name.png" >/dev/null 2>&1 || true
              echo "step $seen ($name): $(tail -n 1 "$f" | cut -c1-300)"
              # The app waits for this file before its next step (MainViewController.afterAck).
              touch "$(dirname "$f")/ack-$seen"
            fi
            [ -n "$(sf smoke.done)" ] && break
            sleep 1
          done
          f=$(sf smoke.jsonl); [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/smoke-signed-in.jsonl"
          xcrun simctl terminate "$UDID" com.knowflow.app || true
          kill "$(cat "$RUNNER_TEMP/log.pid")" 2>/dev/null || true
          # The last line of defence for the artifact: neither credential may
          # appear in anything kept, whatever the app recorded.
          if grep -qF -- "$KF_SMOKE_PASSWORD" "$RUNNER_TEMP/smoke-signed-in.jsonl" "$RUNNER_TEMP/app.log" 2>/dev/null; then echo "FAIL: a credential reached a recorded file"; rm -f "$RUNNER_TEMP/smoke-signed-in.jsonl" "$RUNNER_TEMP/app.log"; exit 1; fi
          test -n "$(sf smoke.done)" || { echo "FAIL: the run did not finish; lines seen: $seen"; grep -iE 'KFSmoke|crash|fatal' "$RUNNER_TEMP/app.log" | tail -n 30 || true; exit 1; }

      - name: Assert the signed-in screens and the 3.1.3(f) reading
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scenario == 'screens' }}
        run: |
          python3 - "$RUNNER_TEMP/smoke-signed-in.jsonl" <<'PY'
          import json, re, sys
          rows = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          by = {r["step"]: r for r in rows}
          fails = []
          def need(cond, msg):
              print(("ok   " if cond else "FAIL ") + msg)
              if not cond: fails.append(msg)
          def P(name): return by.get(name, {}).get("probe", {})
          L = P("launch")
          need(re.match(r"^https://tryknowflow\.com/(en|ar)/login$", L.get("href", "") or ""), f"the first page is the login twin: {L.get('href')}")
          need(L.get("google") == 0 and L.get("bridge") is True, f"...the twin, with the bridge: google={L.get('google')} bridge={L.get('bridge')}")
          need(by.get("login", {}).get("result") == "submitted", f"the login form was filled and submitted: {by.get('login', {}).get('result')}")
          H = P("home")
          need(re.search(r"/(en|ar)/dashboard$", H.get("href", "") or ""), f"the dashboard opened after sign-in: {H.get('href')}")
          need(H.get("signedIn") is True, f"...signed in (the Settings link is in the chrome): {H.get('signedIn')}")
          S = P("subject")
          need(re.search(r"/dashboard/knowledge/[0-9a-f-]{36}$", S.get("href", "") or ""), f"a subject opened: {S.get('href')}")
          need("photosynthesis" in (S.get("text", "") or "").lower(), f"...and it lists the seeded material: {S.get('text', '')[:120]}")
          need(by.get("summary", {}).get("result") == "scrolled to summary", f"the summary is on the subject page: {by.get('summary', {}).get('result')}")
          need(by.get("quiz-open", {}).get("result") == "clicked quiz", f"the quiz button is on the subject page: {by.get('quiz-open', {}).get('result')}")
          # Apple 5.1.2(i): the first quiz asks first, naming both companies.
          need(by.get("consent", {}).get("result") == "accepted: Anthropic, Voyage AI", f"the AI permission sheet opened before the quiz, named both companies and was accepted: {by.get('consent', {}).get('result')}")
          need(by.get("quiz", {}).get("result") == "scrolled to quiz", f"the quiz (served from its cache) is on screen with its answer button: {by.get('quiz', {}).get('result')}")
          A = P("ask")
          need(re.search(r"/dashboard/agent$", A.get("href", "") or ""), f"the Ask screen opened: {A.get('href')}")
          T = P("settings")
          need(re.search(r"/dashboard/settings$", T.get("href", "") or ""), f"Settings opened: {T.get('href')}")
          # Settings shows the permission as given, and withdrawing it is saved:
          # this also leaves the reviewer account as App Review must find it,
          # without the permission, so the reviewer meets the sheet.
          need(by.get("consent-on", {}).get("result") == "on", f"Settings shows the permission given: {by.get('consent-on', {}).get('result')}")
          need(by.get("consent-withdraw", {}).get("result") == "clicked withdraw", f"the withdraw button is there: {by.get('consent-withdraw', {}).get('result')}")
          need(by.get("consent-off", {}).get("result") == "off", f"...and withdrawing turned it off: {by.get('consent-off', {}).get('result')}")
          # STORE_PATH.md S3(a): the study reminder card, inside the app only,
          # off at 19:00 until the switch is used; on schedules one daily
          # reminder, a new time replaces it, off cancels it.
          def pend(name):
              try: return [(n.get("id"), (n.get("on") or {}).get("hour"), (n.get("on") or {}).get("minute")) for n in json.loads(by.get(name, {}).get("result") or "x")]
              except Exception: return by.get(name, {}).get("result")
          need(by.get("reminder-card", {}).get("result") == "off 19:00", f"the reminder card is in Settings, off, at 19:00: {by.get('reminder-card', {}).get('result')}")
          need(by.get("reminder-read-on", {}).get("result") == "on 19:00" and pend("reminder-pending-on") == [(7001, 19, 0)], f"switching it on schedules one daily reminder at 19:00: {by.get('reminder-read-on', {}).get('result')} {pend('reminder-pending-on')}")
          need(by.get("reminder-read-time", {}).get("result") == "on 07:30" and pend("reminder-pending-time") == [(7001, 7, 30)], f"a new time replaces it: {by.get('reminder-read-time', {}).get('result')} {pend('reminder-pending-time')}")
          need(by.get("reminder-read-off", {}).get("result") == "off 07:30" and pend("reminder-pending-off") == [], f"switching it off cancels it: {by.get('reminder-read-off', {}).get('result')} {pend('reminder-pending-off')}")
          for name in ("home", "home-bottom", "subjects", "subject", "summary", "quiz-open", "consent", "quiz", "ask", "settings", "consent-on", "consent-off", "reminder-card", "reminder-read-on", "reminder-read-off", "settings-bottom"):
              p = P(name).get("purchase", {}) or {}
              need(not p.get("words") and not p.get("hrefs"), f"3.1.3(f) on {name}: no price, plan, upgrade or checkout word or link: words={p.get('words')} hrefs={p.get('hrefs')}")
              need(P(name).get("google") == 0, f"no Google button on {name}: {P(name).get('google')}")
          print(f"\n{len(fails)} failure(s) of {len(rows)} readings")
          sys.exit(1 if fails else 0)
          PY

      # THE BACKGROUND-UPLOAD MEASUREMENT (PROGRESS.md 2026-10-09, T5 replaced by
      # the simulator). Dispatch only, scenario background-upload. The reviewer
      # account uploads three files of 4,000,000 spaces through the real drop
      # zone of its subject: a file with no text, so the ingestion service finds
      # nothing to embed and nothing reaches Voyage AI or Anthropic (no cost),
      # while the request is the same 4 MB a student sends. Uploads 1 and 2 go
      # over a link throttled to 256 kbit/s (dummynet on this runner), so the
      # bytes are still leaving when the app is sent to the background (by
      # opening the Settings app) for 30 s and then 120 s; upload 3 is not
      # throttled, so the app is away (60 s) while it waits for the server's
      # answer. A monitor in the page logs every event of the request, the
      # page's visibility and the drop zone's sentence with the wall clock; this
      # step logs when the app left and came back, with its process id, and
      # photographs the screen at each point. Each upload is then deleted
      # through the material's own Delete control, and the AI permission the
      # first upload asked for is withdrawn in Settings at the end. The
      # e-mail mask of the probe applies to every screenshot.
      - name: Background-upload measurement against the live site
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'background-upload' }}
        env:
          KF_SMOKE_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          KF_SMOKE_PASSWORD: ${{ secrets.REVIEWER_PASSWORD }}
        run: |
          set -eu
          test -n "$KF_SMOKE_EMAIL" || { echo "REVIEWER_EMAIL is empty"; exit 1; }
          test -n "$KF_SMOKE_PASSWORD" || { echo "REVIEWER_PASSWORD is empty"; exit 1; }
          cat > "$RUNNER_TEMP/steps.json" <<'JSON'
          [
