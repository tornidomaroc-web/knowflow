          {"name":"instrument-1","wait":500,"js":"(function(){if(window.__kfMon){return 'already'}window.__kfMon=1;var L=function(e){try{var a=JSON.parse(localStorage.getItem('kfBg')||'[]');a.push([Date.now(),e]);localStorage.setItem('kfBg',JSON.stringify(a))}catch(x){}};document.addEventListener('visibilitychange',function(){L('vis:'+document.visibilityState)});window.addEventListener('pagehide',function(){L('pagehide')});window.addEventListener('pageshow',function(ev){L('pageshow:'+ev.persisted)});window.addEventListener('online',function(){L('online')});window.addEventListener('offline',function(){L('offline')});var O=XMLHttpRequest.prototype.open,S=XMLHttpRequest.prototype.send;XMLHttpRequest.prototype.open=function(m,u){this.__u=u;return O.apply(this,arguments)};XMLHttpRequest.prototype.send=function(b){var x=this;if(/\\/api\\/ingest/.test(x.__u||'')){L('xhr:send');var last=-1;x.upload.addEventListener('progress',function(ev){var q=Math.floor(ev.loaded/ev.total*4);if(q!==last){last=q;L('up:'+ev.loaded)}});x.upload.addEventListener('load',function(){L('up:done')});x.upload.addEventListener('error',function(){L('up:error')});x.upload.addEventListener('abort',function(){L('up:abort')});x.addEventListener('load',function(){L('xhr:load:'+x.status+':'+(x.responseText||'').replace(/[0-9a-f-]{36}/g,'<id>').slice(0,90))});x.addEventListener('error',function(){L('xhr:error')});x.addEventListener('abort',function(){L('xhr:abort')});x.addEventListener('timeout',function(){L('xhr:timeout')})}return S.apply(this,arguments)};var mo=new MutationObserver(function(){var z=document.querySelector('[aria-busy]');var t=z?(z.innerText||'').replace(/\\s+/g,' ').replace(/[0-9]+/g,'#').slice(0,160):'';if(t!==window.__kfZ){window.__kfZ=t;L('ui:'+t)}});mo.observe(document.body,{subtree:true,childList:true,characterData:true});L('monitor');return 'installed'})()"},
