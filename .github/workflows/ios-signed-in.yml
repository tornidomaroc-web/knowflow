          JSON
          steps=$(base64 < "$RUNNER_TEMP/steps.json" | tr -d '\n')
          T="$RUNNER_TEMP/bg-timeline.txt"; : > "$T"
          now() { python3 -c 'import time; print(int(time.time()*1000))'; }
          apppid() { xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | awk '/UIKitApplication:com\.knowflow\.app/{print $1; exit}'; }
          shot() { xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$1.png" >/dev/null 2>&1 || true; }
          away() {
            tag=$1; secs=$2
            pid0=$(apppid)
            xcrun simctl launch "$UDID" com.apple.Preferences >/dev/null
            echo "$(now) $tag background (app pid $pid0)" >> "$T"
            sleep 2; shot "$tag-away"
            sleep $((secs - 2))
            xcrun simctl launch "$UDID" com.knowflow.app >/dev/null
            sleep 1
            echo "$(now) $tag foreground (app pid $(apppid))" >> "$T"
            sleep 1; shot "$tag-back"
          }
          xcrun simctl install "$UDID" "$APP_PATH"
          data=$(xcrun simctl get_app_container "$UDID" com.knowflow.app data)
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "App"' > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/log.pid"
          SIMCTL_CHILD_KF_SMOKE=1 SIMCTL_CHILD_KF_SMOKE_STEPS="$steps" SIMCTL_CHILD_KF_SMOKE_EMAIL="$KF_SMOKE_EMAIL" SIMCTL_CHILD_KF_SMOKE_PASSWORD="$KF_SMOKE_PASSWORD" xcrun simctl launch "$UDID" com.knowflow.app --kf-smoke &
          sf() { find "$data/tmp" -maxdepth 3 -name "$1" 2>/dev/null | head -n 1; }
          seen=0
          for i in $(seq 1 4000); do
            f=$(sf smoke.jsonl); n=0; [ -n "$f" ] && n=$(wc -l < "$f" | tr -d ' ')
            if [ "$n" -gt "$seen" ]; then
              seen=$n
              name=$(tail -n 1 "$f" | python3 -c 'import json,sys; print(json.loads(sys.stdin.readline())["step"])')
              echo "$(now) line $seen $name" >> "$T"
              # The app leaves first and is photographed after: the request is
              # out for seconds only, and a screenshot takes one.
              case "$name" in
                bg-1-start) away bg-1 30 ;;
                bg-2-start) away bg-2 120 ;;
                *) shot "bg-$seen-$name" ;;
              esac
              echo "step $seen ($name): $(tail -n 1 "$f" | python3 -c 'import json,sys; r=json.loads(sys.stdin.readline()); print(str(r.get("result"))[:300], "| appState", r.get("appState"))')"
              touch "$(dirname "$f")/ack-$seen"
            fi
            [ -n "$(sf smoke.done)" ] && break
            sleep 0.25
          done
          f=$(sf smoke.jsonl); [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/smoke-bg.jsonl"
          xcrun simctl terminate "$UDID" com.knowflow.app || true
          kill "$(cat "$RUNNER_TEMP/log.pid")" 2>/dev/null || true
          if grep -qF -- "$KF_SMOKE_PASSWORD" "$RUNNER_TEMP/smoke-bg.jsonl" "$RUNNER_TEMP/app.log" 2>/dev/null; then echo "FAIL: a credential reached a recorded file"; rm -f "$RUNNER_TEMP/smoke-bg.jsonl" "$RUNNER_TEMP/app.log"; exit 1; fi
          test -n "$(sf smoke.done)" || { echo "FAIL: the run did not finish; lines seen: $seen"; exit 1; }

      - name: Report the background-upload measurement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'background-upload' }}
        run: |
          python3 - "$RUNNER_TEMP/smoke-bg.jsonl" "$RUNNER_TEMP/bg-timeline.txt" <<'PY'
          import json, sys
          rows = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          by = {r["step"]: r for r in rows}
          tl = [l.split(" ", 1) for l in open(sys.argv[2]).read().splitlines() if l.strip()]
          fails = []
          def need(cond, msg):
              print(("ok   " if cond else "FAIL ") + msg)
              if not cond: fails.append(msg)
          print("timeline (ms, runner clock):")
          for t, what in tl: print("  ", t, what)
          print("\nAI permission:", by.get("allow", {}).get("result"), "/", by.get("allow-accept", {}).get("result"))
          print("left from before:", by.get("cleanup-0-open", {}).get("result"), "/", by.get("cleanup-0-confirm", {}).get("result"), "/", by.get("cleanup-0-check", {}).get("result"))
          for n in (1, 2):
              print(f"\n===== upload {n}")
              print("  start:", by.get(f"bg-{n}-start", {}).get("result"))
              try:
                  ev = json.loads(by.get(f"bg-{n}-report", {}).get("result") or "[]")
              except Exception:
                  ev = []
              bg = [int(t) for t, w in tl if w.startswith(f"bg-{n} background")]
              fg = [int(t) for t, w in tl if w.startswith(f"bg-{n} foreground")]
              send = next((t for t, e in ev if e == "xhr:send"), None)
              for t, e in ev:
                  rel = (t - send) / 1000 if send else 0
                  print(f"  {rel:8.1f} s  {e}")
              if send and bg and fg:
                  print(f"  away from {(bg[0]-send)/1000:.1f} s to {(fg[0]-send)/1000:.1f} s after the send")
              end = next(((t, e) for t, e in ev if e.startswith(("xhr:load", "xhr:error", "xhr:abort", "xhr:timeout"))), None)
              print("  end:", (f"{(end[0]-send)/1000:.1f} s {end[1]}" if end and send else "NONE: the request never ended in the page"))
              for k in range(1, 5):
                  r = by.get(f"bg-{n}-observe-{k}", {}).get("result")
                  if r: print(f"  observe {k}:", r[:220])
              print("  cleanup:", by.get(f"cleanup-{n}-open", {}).get("result"), "/", by.get(f"cleanup-{n}-confirm", {}).get("result"), "/", by.get(f"cleanup-{n}-check", {}).get("result"))
              need(bool(send), f"upload {n} was sent")
              need(bool(bg and send and end) and bg[0] < end[0], f"upload {n}: the app left before the request ended (the measurement is valid)")
          need(by.get("consent-off", {}).get("result") == "off", f"the reviewer account is left without the AI permission: {by.get('consent-off', {}).get('result')}")
          for tag in ("0", "1", "2"):
              need(by.get(f"cleanup-{tag}-check", {}).get("result") == "left 0", f"no kf-bg-upload material left after cleanup {tag}: {by.get(f'cleanup-{tag}-check', {}).get('result')}")
          print(f"\n{len(fails)} failure(s)")
          sys.exit(1 if fails else 0)
          PY

      # THE APP STORE SCREENSHOTS (STORE_PATH.md S6, guideline 2.3.3: the app in
      # use). Dispatch only, scenario screenshots. A Pro Max simulator with
      # Apple's marketing status bar (boot step), the reviewer account, the live
      # site, the seeded material only. Before signing in, the login page's
      # forgot link is followed for real: the page opens in the app and the
      # reviewer's address is sent (a recovery mail, which the agent checks
      # arrived and never opens). Every probe masks e-mail text before a
      # screenshot, and Settings is photographed scrolled past the account card.
      # Each shot-* line is saved as store/<locale>/<NN-name>.png and its size
      # must be 1320 x 2868. The AI permission the quiz asks for is withdrawn at
      # the end, and the app is left in English.
      - name: App Store screenshots against the live site
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'screenshots' }}
        env:
          KF_SMOKE_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          KF_SMOKE_PASSWORD: ${{ secrets.REVIEWER_PASSWORD }}
        run: |
          set -eu
          test -n "$KF_SMOKE_EMAIL" || { echo "REVIEWER_EMAIL is empty"; exit 1; }
          test -n "$KF_SMOKE_PASSWORD" || { echo "REVIEWER_PASSWORD is empty"; exit 1; }
          cat > "$RUNNER_TEMP/steps.json" <<'JSON'
          [
          {"name":"forgot-open","wait":6000,"js":"(function(){var a=document.querySelector('a[href$=\"/forgot-password\"]');if(!a){return 'no forgot link'}a.click();return 'clicked forgot link'})()"},
