<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KnowFlow · لا اتصال</title>
  <!-- Shown by the shell when a page from tryknowflow.com cannot be loaded
       (capacitor.config.ts, server.errorPath): no network, or the site
       unreachable. Static and bundled, so it needs nothing from the network.
       Arabic first, English under it, as the product is; the same dark ground
       and gold as the site (src/app/globals.css). The button reloads the site's
       root, which the middleware sends to the dashboard or the login page. -->
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b0d12; color: #e8e6e1; font-family: Rubik, system-ui, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); text-align: center; }
    .mark { font-weight: 700; font-size: 22px; margin-bottom: 12px; }
    .mark b { color: #d4a53a; }
    h1 { font-size: 20px; margin: 0; }
    p { margin: 0; color: #a8a5a0; font-size: 15px; line-height: 1.5; max-width: 28rem; }
    .en { direction: ltr; }
    button { margin-top: 20px; background: #d4a53a; color: #14120a; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600; font-size: 16px; }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <div class="mark">Know<b>Flow</b></div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقّق من الاتصال ثم حاول مرة أخرى.</p>
    <p class="en">No internet connection. Check the connection and try again.</p>
    <button type="button" onclick="location.href='https://tryknowflow.com/'">حاول مرة أخرى · Try again</button>
  </main>
</body>
</html>
