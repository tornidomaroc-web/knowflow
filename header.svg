<svg width="800" height="130" viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg">
  <defs><style>
    .t1{font-family:'Courier New',monospace;font-size:32px;font-weight:700;fill:#0d0d0d}
    .t2{font-family:'Courier New',monospace;font-size:13px;fill:#555}
    .t3{font-family:'Courier New',monospace;font-size:12px;fill:#999}
    .cursor{fill:#1D9E75;animation:blink 1.1s step-end infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .row1{animation:up 0.5s ease 0.05s both}
    .row2{animation:up 0.5s ease 0.25s both}
    .row3{animation:up 0.5s ease 0.45s both}
    .row4{animation:up 0.5s ease 0.65s both}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style></defs>
  <rect width="800" height="130" fill="#f8f8f6"/>
  <rect x="0" y="0" width="4" height="130" fill="#1D9E75"/>
  <g class="row1"><text x="28" y="54" class="t1">Abo Jad</text><rect x="168" y="26" width="10" height="32" rx="1" class="cursor"/></g>
  <g class="row2"><text x="28" y="80" class="t2">Independent builder · SaaS · AI · Arabic-first products</text></g>
  <g class="row3"><text x="28" y="102" class="t3">🇲🇦 Morocco</text><rect x="104" y="92" width="1" height="13" fill="#ddd"/><text x="114" y="102" class="t3">github.com/tornidomaroc-web</text><rect x="288" y="92" width="1" height="13" fill="#ddd"/><text x="298" y="102" class="t3">5 live products</text></g>
  <g class="row4"><rect x="28" y="116" width="60" height="2" rx="1" fill="#1D9E75"/><rect x="96" y="116" width="30" height="2" rx="1" fill="#BA7517"/><rect x="134" y="116" width="20" height="2" rx="1" fill="#185FA5"/></g>
</svg>
